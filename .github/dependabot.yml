# Dependency update automation for the pnpm workspace. Dependabot only opens pull
# requests; nothing is merged automatically and no secret is required.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      npm-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
