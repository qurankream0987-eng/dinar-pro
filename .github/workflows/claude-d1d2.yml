name: claude-d1d2

# D1/D2 evidence on the isolated Claude branch: typecheck, both builds, and the D1/D2 suites on a
# disposable PostgreSQL 16 and 18 service, plus the Chromium browser journey. Manual dispatch only.
# No deployment, no provider keys, no paid calls, no production data.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-d1d2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: dinar_isolation
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dinar_isolation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DINAR_LOCAL_PG: postgres://dinar_isolation@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/dinar run build
      - name: Install Chromium
        working-directory: artifacts/dinar
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "DINAR_CHROMIUM=$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: D1/D2 acceptance
        working-directory: artifacts/api-server
        run: sh test/isolation/local-suite.sh d1-d2-business-foundation.test BDINAR_D1D2_ACCEPTANCE=development BDINAR_PROMOTIONS_ENABLED=true
      - name: D1/D2 browser acceptance
        working-directory: artifacts/api-server
        run: sh test/isolation/local-suite.sh d1-d2-business-browser.test BDINAR_D1D2_ACCEPTANCE=development BDINAR_PROMOTIONS_ENABLED=true
      - name: Subscription and readiness regressions
        working-directory: artifacts/api-server
        run: |
          sh test/isolation/local-suite.sh closure-integrations.test BDINAR_CLOSURE_ACCEPTANCE=development BDINAR_WAVE4_ACCEPTANCE=development BDINAR_PROMOTIONS_ENABLED=true
          sh test/isolation/local-suite.sh next-g1-usage.test BDINAR_G1_ACCEPTANCE=development BDINAR_PROMOTIONS_ENABLED=true
          DINAR_SUITE_SEED=none sh test/isolation/local-suite.sh readiness.test
