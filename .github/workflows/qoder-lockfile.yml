name: qoder-lockfile

# Bootstrap-only: regenerates pnpm-lock.yaml for the dependency bump and uploads it.
# Removed from the branch once the lockfile is committed. Read-only token, no secrets.

on:
  push:
    branches:
      - qoder/10-security-deps

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Show resolved versions
        run: |
          grep -nE '^  zod@|^  qs@' pnpm-lock.yaml || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
