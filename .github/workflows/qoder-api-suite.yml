name: qoder-api-suite

# Isolated, development-only acceptance runner.
# - No repository secrets are referenced; nothing here can reach Railway, production, a payment
#   provider or a paid AI provider.
# - Every third-party action is pinned to a reviewed commit SHA (same pins as qoder-security.yml).
# - The only database is the ephemeral PostgreSQL service below on 127.0.0.1, and local-suite.sh
#   creates and drops a random throwaway database inside it.
# - Inputs are closed allowlists: `suite` and `chain` are choices; chain members are fixed here;
#   `flags` is validated against a fixed switch list before it reaches the shell.
#   Values are never interpolated into shell source.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Allowlisted test/run.mjs suite"
        required: true
        type: choice
        default: wave07-financial-journal.test
        options:
          - wave07-financial-journal.test
          - wave08-cash-and-refunds.test
          - wave09-policy-consent-compliance.test
          - wave10-trust-support-whatsapp.test
          - wave07-w12-contract-hardening.test
          - d1-d2-business-foundation.test
          - d1-d2-business-browser.test
          - policy-consent-cards.test
          - w02u3-card-reliability.test
          - w02u3-card-reliability-browser-journey.test
          - w02u3-card-concurrency-browser-journey.test
          - w02u3-card-sessions-browser-journey.test
          - w02u3-card-recovery-browser-journey.test
          - w02u3-card-expiry-browser-journey.test
          - w02u3-card-accessibility-browser-journey.test
          - w02u3-card-performance-browser-journey.test
          - search-sql-foundation.test
          - search-sql-performance.test
          - financial-state-machine.test
          - payment-order-state.test
          - wave4-payment-acceptance.test
          - wave3-acceptance.test
          - wave02-card-reliability.test
          - r5-delivery-economics.test
          - security-acceptance.test
          - readiness.test
          - ai-provider.test
          - development-tls.test
          - phase1-acceptance.test
          - commerce-journey.test
          - sc01-browser-journey.test
          - sc02-browser-journey.test
          - sc03-browser-journey.test
          - sc06-browser-journey.test
          - sc07-browser-journey.test
          - sc10-browser-journey.test
          - wave03-card-envelope-browser-journey.test
          - d3a-native-business.test
          - d3a-browser-journey.test
          - business-delegations.test
          - d5-seller-employee-acceptance.test
          - d4-d5-isolation-security.test
          - d12-execution-recovery.test
          - next-g2-inquiry.test
          - universal-negotiation-acceptance.test
          - g2-smart-conversation.test
          - model-native-routing.test
          - bounded-multistep.test
          - promotion-intent.test
          - block-f2-buyer.test
          - block-f3-commerce.test
          - ai-foundation-acceptance.test
          - ai-authority-boundary.test
      chain:
        description: "Run a reviewed suite chain on one disposable migrated and seeded database"
        required: false
        type: choice
        default: none
        options:
          - none
          - financial-waves-w07-w12c
          - business-cards-search-commerce
          - integrated-nine-interleaved
          - d4-d5-authorization
          - d6-g2-negotiation
          - ai-foundation
      flags:
        description: "Allowlisted KEY=VALUE switches, space separated"
        required: false
        default: ""
      pg_version:
        description: "PostgreSQL major version"
        required: true
        type: choice
        default: "16"
        options:
          - "16"
          - "18"

permissions:
  contents: read

concurrency:
  group: qoder-api-${{ github.ref }}-${{ inputs.chain }}-${{ inputs.suite }}-${{ inputs.pg_version }}
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:${{ inputs.pg_version }}
        env:
          POSTGRES_USER: dinar_isolation
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dinar_isolation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DINAR_LOCAL_PG: postgres://dinar_isolation@127.0.0.1:5432
      SUITE: ${{ inputs.suite }}
      CHAIN: ${{ inputs.chain }}
      FLAGS: ${{ inputs.flags }}
    steps:
      - name: Validate inputs
        env:
          PG_MAJOR: ${{ inputs.pg_version }}
        run: |
          set -eu
          case "$PG_MAJOR" in 16|18) ;; *) echo "pg_version not allowlisted: $PG_MAJOR" >&2; exit 96 ;; esac
          for pair in $FLAGS; do
            case "$pair" in
              *=*) ;;
              *) echo "switch is not KEY=VALUE: $pair" >&2; exit 96 ;;
            esac
            key=${pair%%=*}
            value=${pair#*=}
            case "$key" in
              BDINAR_W07_ACCEPTANCE|BDINAR_W08_ACCEPTANCE|BDINAR_W09_ACCEPTANCE|BDINAR_W10_ACCEPTANCE|BDINAR_W12C_ACCEPTANCE|BDINAR_D1D2_ACCEPTANCE|BDINAR_W02U3_TEST_DATABASE|BDINAR_W02U3_BROWSER|BDINAR_D3A_ACCEPTANCE|BDINAR_WAVE4_ACCEPTANCE|BDINAR_WAVE3_ACCEPTANCE|BDINAR_WAVE02_ACCEPTANCE|BDINAR_PHASE1_ACCEPTANCE|BDINAR_SECURITY_ACCEPTANCE|BDINAR_D4_ACCEPTANCE|BDINAR_D5_ACCEPTANCE|BDINAR_A02_ISOLATION|BDINAR_G2_ACCEPTANCE|BDINAR_BLOCKF_ACCEPTANCE|BDINAR_AI_FOUNDATION)
                [ "$value" = development ] || { echo "$key must be development" >&2; exit 96; } ;;
              BDINAR_LOG_SCAN)
                case "$value" in 0|1) ;; *) echo "$key must be 0 or 1" >&2; exit 96 ;; esac ;;
              BDINAR_PHASE1_SKIP_BROWSER)
                [ "$value" = 1 ] || { echo "$key must be 1" >&2; exit 96; } ;;
              BDINAR_TEST_DATABASE)
                [ "$value" = development ] || { echo "$key must be development" >&2; exit 96; } ;;
              BDINAR_PROMOTIONS_ENABLED)
                [ "$value" = true ] || { echo "$key must be true" >&2; exit 96; } ;;
              DINAR_TLS_ACCEPTANCE)
                [ "$value" = development ] || { echo "$key must be development" >&2; exit 96; } ;;
              *)
                echo "switch not allowlisted: $key" >&2
                exit 96 ;;
            esac
          done
          # Chain contents are fixed here, never supplied by the dispatch payload. Validate their
          # safety gates before expensive setup so a partial chain cannot start with missing approval.
          has_flag() { case " $FLAGS " in *" $1=development "*) return 0 ;; *) return 1 ;; esac; }
          require_flags() {
            for key in $1; do
              has_flag "$key" || { echo "chain $CHAIN requires $key=development" >&2; exit 96; }
            done
          }
          SUITES="$SUITE"
          promotions=0
          case "$CHAIN" in
            none) ;;
            financial-waves-w07-w12c)
              SUITES="wave07-financial-journal.test wave08-cash-and-refunds.test wave09-policy-consent-compliance.test wave10-trust-support-whatsapp.test wave07-w12-contract-hardening.test"
              require_flags "BDINAR_TEST_DATABASE BDINAR_W07_ACCEPTANCE BDINAR_W08_ACCEPTANCE BDINAR_W09_ACCEPTANCE BDINAR_W10_ACCEPTANCE BDINAR_W12C_ACCEPTANCE BDINAR_WAVE4_ACCEPTANCE" ;;
            business-cards-search-commerce)
              SUITES="d1-d2-business-foundation.test w02u3-card-reliability.test search-sql-foundation.test commerce-journey.test"
              require_flags "BDINAR_TEST_DATABASE BDINAR_D1D2_ACCEPTANCE BDINAR_W02U3_TEST_DATABASE BDINAR_WAVE4_ACCEPTANCE"
              promotions=1 ;;
            integrated-nine-interleaved)
              SUITES="wave07-financial-journal.test d1-d2-business-foundation.test wave08-cash-and-refunds.test w02u3-card-reliability.test wave09-policy-consent-compliance.test search-sql-foundation.test wave10-trust-support-whatsapp.test commerce-journey.test wave07-w12-contract-hardening.test"
              require_flags "BDINAR_TEST_DATABASE BDINAR_W07_ACCEPTANCE BDINAR_W08_ACCEPTANCE BDINAR_W09_ACCEPTANCE BDINAR_W10_ACCEPTANCE BDINAR_W12C_ACCEPTANCE BDINAR_D1D2_ACCEPTANCE BDINAR_W02U3_TEST_DATABASE BDINAR_WAVE4_ACCEPTANCE"
              promotions=1 ;;
            d4-d5-authorization)
              SUITES="business-delegations.test d5-seller-employee-acceptance.test d4-d5-isolation-security.test"
              require_flags "BDINAR_D4_ACCEPTANCE BDINAR_D5_ACCEPTANCE BDINAR_A02_ISOLATION" ;;
            d6-g2-negotiation)
              SUITES="next-g2-inquiry.test universal-negotiation-acceptance.test g2-smart-conversation.test model-native-routing.test bounded-multistep.test promotion-intent.test block-f2-buyer.test block-f3-commerce.test"
              require_flags "BDINAR_G2_ACCEPTANCE BDINAR_WAVE4_ACCEPTANCE BDINAR_TEST_DATABASE BDINAR_BLOCKF_ACCEPTANCE"
              promotions=1 ;;
            ai-foundation)
              SUITES="ai-foundation-acceptance.test ai-authority-boundary.test bounded-multistep.test"
              require_flags "BDINAR_AI_FOUNDATION BDINAR_TEST_DATABASE" ;;
            *) echo "chain not allowlisted: $CHAIN" >&2; exit 96 ;;
          esac
          if [ "$promotions" = 1 ]; then
            case " $FLAGS " in *" BDINAR_PROMOTIONS_ENABLED=true "*) ;;
              *) echo "chain $CHAIN requires BDINAR_PROMOTIONS_ENABLED=true" >&2; exit 96 ;; esac
          fi
          echo "SUITES=$SUITES" >> "$GITHUB_ENV"
          # Resolve browser installation from the actual suite list, not the ignored suite input.
          needs_chromium() {
            case "$1" in
              *browser-journey*|*browser.test|security-acceptance.test|wave3-acceptance.test|w02-ultra-browser.test) return 0 ;;
              phase1-acceptance.test)
                case " $FLAGS " in *" BDINAR_PHASE1_SKIP_BROWSER=1 "*) return 1 ;; *) return 0 ;; esac ;;
              *) return 1 ;;
            esac
          }
          chromium=0
          for name in $SUITES; do
            if needs_chromium "$name"; then chromium=1; fi
          done
          echo "NEEDS_CHROMIUM=$chromium" >> "$GITHUB_ENV"
          echo "INPUTS_OK suite=$SUITE chain=$CHAIN chromium=$chromium pg=$PG_MAJOR switches=$(printf '%s' "$FLAGS" | wc -w)"

      - name: Confirm loopback-only database target
        run: |
          set -eu
          case "$DINAR_LOCAL_PG" in
            postgres://*@127.0.0.1:*) ;;
            *) echo "DINAR_LOCAL_PG must be loopback" >&2; exit 96 ;;
          esac
          case "${DINAR_LOCAL_PG#*://*@*:}" in
            */*) echo "DINAR_LOCAL_PG must not name a database" >&2; exit 96 ;;
          esac
          if [ -n "${DATABASE_URL:-}" ] || [ -n "${DINAR_DEV_DATABASE_URL:-}" ]; then
            echo "ambient DATABASE_URL must not be inherited from the runner" >&2
            exit 96
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Build web
        run: pnpm --filter @workspace/dinar run build

      - name: Surface protocol tests (web)
        run: pnpm --filter @workspace/dinar run test:surfaces

      - name: Install Chromium (browser journeys and XSS acceptance)
        if: env.NEEDS_CHROMIUM == '1'
        working-directory: artifacts/dinar
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "DINAR_CHROMIUM=$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Run an isolated suite or the selected shared-database chain
        working-directory: artifacts/api-server
        run: sh test/isolation/local-suite.sh $SUITES $FLAGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-log-${{ inputs.chain }}-${{ inputs.suite }}-pg${{ inputs.pg_version }}
          path: |
            artifacts/api-server/*.log
          if-no-files-found: ignore
          retention-days: 14
