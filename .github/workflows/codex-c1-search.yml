name: codex-c1-search
on:
  push:
    branches: [codex/11-c1-sql-search]
    paths:
      - '.github/workflows/codex-c1-search.yml'
      - 'artifacts/api-server/**'
      - 'lib/**'
permissions:
  contents: read
concurrency:
  group: codex-c1-search
  cancel-in-progress: false
jobs:
  postgres-search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dinar_isolation
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dinar_isolation -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      personal:
        image: postgres:16
        env:
          POSTGRES_USER: dinar_isolation
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ['55479:5432']
        options: --health-cmd "pg_isready -U dinar_isolation -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      migration:
        image: postgres:18
        env:
          POSTGRES_USER: dinar_isolation
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ['55480:5432']
        options: --health-cmd "pg_isready -U dinar_isolation -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/dinar run build
      - name: Install Chromium
        working-directory: artifacts/dinar
        run: pnpm exec playwright install --with-deps chromium
      - name: Local browser assets
        shell: bash
        run: |
          mkdir -p /tmp/dinar-c1-browser
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=dinar-c1-test" -keyout /tmp/dinar-c1-browser/stub.key -out /tmp/dinar-c1-browser/stub.crt
          SPKI=$(openssl x509 -in /tmp/dinar-c1-browser/stub.crt -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | base64)
          CHROME=$(cd artifacts/dinar && node -e 'console.log(require("@playwright/test").chromium.executablePath())')
          cat > /tmp/dinar-c1-browser/chromium <<EOF
          #!/bin/sh
          exec "$CHROME" --no-sandbox --host-resolver-rules="MAP fonts.googleapis.com 127.0.0.1, MAP fonts.gstatic.com 127.0.0.1, MAP images.unsplash.com 127.0.0.1" --ignore-certificate-errors-spki-list="$SPKI" "\$@"
          EOF
          chmod +x /tmp/dinar-c1-browser/chromium
          sudo "$(command -v node)" artifacts/api-server/test/isolation/third-party-stub.mjs /tmp/dinar-c1-browser/stub.crt /tmp/dinar-c1-browser/stub.key 443 /tmp/dinar-c1-browser/stub.log &
          echo "DINAR_CHROMIUM=/tmp/dinar-c1-browser/chromium" >> "$GITHUB_ENV"
      - name: Full sequential regression battery
        working-directory: artifacts/api-server
        env:
          DINAR_LOCAL_PG: postgres://dinar_isolation@127.0.0.1:5432
        run: node test/isolation/c1-battery.mjs
      - name: Surface contracts
        if: always()
        run: pnpm --filter @workspace/dinar run test:surfaces
      - name: Database and secret guards
        if: always()
        run: pnpm --filter @workspace/api-server run test:db-guard && pnpm --filter @workspace/api-server run test:secrets
      - name: PostgreSQL 18 release migration
        if: always()
        env:
          DINAR_RELEASE_MIGRATION_TEST_PG: postgres://dinar_isolation@127.0.0.1:55480
        run: pnpm --filter @workspace/db run test:release-migration
      - name: Acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c1-evidence
          path: |
            artifacts/api-server/c1-evidence/
            /tmp/dinar-c1-browser/stub.log
          if-no-files-found: warn

