          minLength: 12
          maxLength: 128
    CourierCommissionSettlement:
      type: object
      required:
        - id
        - courierId
        - marketId
        - amountMinor
        - currencyCode
        - minorUnitScale
        - receivableCount
        - idempotencyKey
        - mode
        - simulatedAt
      properties:
        id: { type: string }
        courierId: { type: string }
        marketId: { type: string }
        amountMinor: { type: integer, minimum: 1 }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        minorUnitScale: { type: integer, minimum: 0, maximum: 3 }
        receivableCount: { type: integer, minimum: 1 }
        idempotencyKey: { type: string }
        mode: { type: string, enum: [SIMULATION_ONLY] }
