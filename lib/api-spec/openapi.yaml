        proposal:
          allOf: [{ $ref: "#/components/schemas/CourierFareProposal" }]
          nullable: true
        agreement:
          allOf: [{ $ref: "#/components/schemas/CourierFareAgreement" }]
          nullable: true
        agreed: { type: boolean }
        idempotent: { type: boolean }
    CourierCommissionBalance:
