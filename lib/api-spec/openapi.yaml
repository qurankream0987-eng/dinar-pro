        courierId: { type: string }
        outstandingDeliveryCount: { type: integer, minimum: 0 }
        hold: { type: boolean }
        holdThreshold: { type: integer, enum: [10] }
        settlementMode: { type: string, enum: [SIMULATION_ONLY] }
        realMoneyTransferred: { type: boolean, enum: [false] }
        balances:
          type: array
          items: { $ref: "#/components/schemas/CourierCommissionBalance" }
        earningsHistory:
          type: array
          items: { $ref: "#/components/schemas/CourierCommissionEarning" }
    CourierCommissionEarning:
      type: object
