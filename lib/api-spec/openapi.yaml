        - agreedFareMinor
        - agreedFare
        - commissionRateBps
        - commissionMinor
        - commission
        - courierShareMinor
        - courierShare
        - currencyCode
        - minorUnitScale
        - receivableStatus
        - simulationClearedAt
        - settlementMode
        - realPaymentVerified
      properties:
        orderId: { type: string }
        orderReference: { type: string }
        completedAt: { type: string, format: date-time }
        marketId: { type: string }
        agreedFareMinor: { type: integer, minimum: 1 }
        agreedFare: { type: string }
        commissionRateBps: { type: integer, enum: [1000] }
        commissionMinor: { type: integer, minimum: 0 }
        commission: { type: string }
        courierShareMinor: { type: integer, minimum: 0 }
        courierShare: { type: string }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        minorUnitScale: { type: integer, minimum: 0, maximum: 3 }
        receivableStatus: { type: string, enum: [OUTSTANDING, SIMULATION_CLEARED] }
        simulationClearedAt: { type: ["string", "null"], format: date-time }
