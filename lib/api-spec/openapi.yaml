          enum: [REJECTED, CANCELLED, EXPIRED, SUPERSEDED]
        title: { type: string, maxLength: 120 }
        resource: { type: string, maxLength: 160 }
        amount:
          type: object
          additionalProperties: false
          required: [value, currency, kind]
          properties:
            value: { type: string, maxLength: 24 }
            currency: { type: string, maxLength: 8 }
            kind: { type: string, enum: [PROPOSED, SUBMITTED, AGREED, PAYMENT] }
        orderId: { type: string, maxLength: 64 }
        paymentState: { type: string, enum: [AWAITING_CONFIRMATION, SIMULATED_CAPTURED, CAPTURED] }
        nextStep: { type: string, maxLength: 200 }
        requiresConfirmation: { type: boolean }
        failure: { type: string, maxLength: 240 }
    AiUiBlock:
      type: object
      required: [type, version, payload]
      properties:
        type: { type: string, enum: [LISTING_RESULTS, SURFACE] }
        version: { type: integer, enum: [1] }
        payload:
          type: object
          required: [resultSetId, listings]
          properties:
            draft: { type: object, additionalProperties: true }
            draftStep: { type: string }
            draftReview:
              type: object
              additionalProperties: true
              description: >
                Typed seller draft review built by the server: each value with its provenance
                (USER_DECLARED, IMAGE_INFERRED, DINAR_DERIVED, SERVER_FACT, UNKNOWN), image
                guesses marked as needing confirmation, every missing required field, and the
                allowed actions (PUBLISH only when nothing is missing, EDIT, CANCEL).
            comparison:
              type: object
              additionalProperties: true
              description: Current server facts of the compared listings side by side; values the seller did not state are null ("غير معروف").
            purchaseReview:
              type: object
              additionalProperties: true
              description: Review of a pending, confirm-only selection (adds to cart after re-reading price, stock and account); never pays.
            card:
              type: object
              additionalProperties: true
              description: >
                The versioned card envelope the server decides for this block (schemaVersion 1):
                surface type and identity, resource, conversation, market context, lifecycle,
                allowed actions, pending review, expiry, refresh strategy, source timestamp and
                accessibility label. The client validates it before rendering and never invents
                an action the server did not allow.
            sellerInsight:
              type: object
              additionalProperties: true
              description: >
                Seller insight from DINAR-internal facts only: price comparables (count, range,
                median), listing factors phrased as possibilities (never as causes), or a
                BUSINESS_SUMMARY of the seller's own stock, order counts or per-listing results
                (shape: SellerBusinessInsight in @workspace/api-zod/conversation-runtime).
            attributes: { type: object, additionalProperties: true }
            resourceIds: { type: array, items: { type: string } }
            resourceId: { type: string }
            sellerContactRequested:
              type: boolean
              description: A request marker only; the number is retrieved separately through the order-authorized no-store endpoint.
            hideMap: { type: boolean }
            searchState: { $ref: "#/components/schemas/AiSearchState" }
            presentation:
              type: string
              enum: [RESULTS, DETAILS]
              description: DETAILS marks one result opened from the conversation's current result set.
            photoSuggestionStatus:
              type: string
              enum: [UNAVAILABLE, FAILED, NO_SUGGESTIONS, SUGGESTIONS]
            photoSuggestions:
              type: array
              maxItems: 12
              items: { $ref: "#/components/schemas/AiPhotoSuggestion" }
            managementPreview:
              type: object
              required: [previewId, action, listingId, listingTitle, fieldLabel, beforeValue, afterValue, status]
              properties:
                previewId: { type: string, format: uuid }
                action: { type: string, enum: [UPDATE, PAUSE, RESUME, ARCHIVE] }
                listingId: { type: string }
                listingTitle: { type: string }
                fieldLabel: { type: string }
                beforeValue: { type: string }
                afterValue: { type: string }
                status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED, EXPIRED] }
            surface: { type: string, enum: [CART, CHECKOUT, AUTH, SETTINGS, ORDERS, ORDER, ORDERS_LIST, ORDER_SELECTOR, ORDER_STATUS, ORDER_TRACKING, SELL, MY_LISTINGS, DUES, MARKET, MARKET_SELECTOR, ACCOUNT, LOGOUT, CLARIFY, UNSUPPORTED, JOB_DRAFT, JOB_REVIEW, JOB_SEARCH_RESULTS, JOB_DETAILS, MY_JOBS, CV_PROFILE, CANDIDATE_SEARCH_RESULTS, CANDIDATE_DETAILS, APPLICATION_REVIEW, MY_APPLICATIONS, APPLICATION_LIST, EMPLOYMENT_ACTION, EMPLOYMENT_NOTICE, LOCATION_PERMISSION_REQUEST, LOCATION_PREVIEW, LOCATION_CONFIRMED, MANUAL_ADDRESS, DELIVERY_OPTIONS, DELIVERY_SUMMARY, DELIVERY_ACTION, DELIVERY_STATUS, PICKUP_DETAILS, DELIVERY_NOTICE, PROMOTION_OPTIONS, PROMOTION_REVIEW, PROMOTION_STATUS, MY_PROMOTIONS, PROMOTION_DETAILS, COMPARISON, PURCHASE_REVIEW, PAYMENT_REVIEW, DRIVER_ONBOARDING, DRIVER_ONBOARDING_REVIEW, DRIVER_STATUS, DRIVER_AVAILABILITY, DELIVERY_WORK_RESULTS, DRIVER_ASSIGNMENT_REVIEW, DRIVER_ASSIGNMENT_STATUS, DRIVER_EARNINGS_HISTORY, PROVIDER_CONNECTION_REVIEW, PROVIDER_SECRET_ONCE, PROVIDER_STATUS, ADVICE, NEGOTIATION_REVIEW, NEGOTIATION_STATUS, NEGOTIATION_LIST, MY_INTERESTS, MEMORY_SUMMARY, MEMORY_CONFIRMATION, MEMORY_UPDATED, COMMERCIAL_BALANCE, COMMERCIAL_LEDGER_SUMMARY, COMMERCIAL_TOPUP_REVIEW, COMMERCIAL_PRODUCTS, COMMERCIAL_PRODUCT_REVIEW, FEATURED_REVIEW, VIP_REVIEW, REFRESH_REVIEW, BUNDLE_REVIEW, BUNDLE_STATUS, PROMOTION_TYPE_OPTIONS, DEMAND_CAPTURE_REVIEW, CAMPAIGN_STATUS, CAMPAIGN_ANALYTICS, MARKET_PULSE, MARKET_OPPORTUNITY, BUSINESS_PLAN_REVIEW, BUSINESS_STATUS, BUSINESS_PROFILE, COMMERCE_NOTICE, AI_USAGE, AI_PLANS, INQUIRY_DRAFT, INQUIRY_STATUS, INQUIRY_INCOMING, INQUIRY_LIST, INQUIRY_NOTICE, APP_THEME, MARKET_SWITCH_REVIEW, MARKET_SWITCH_STATUS, PROFILE_REVIEW, PROFILE_STATUS, CONTROL_NOTICE, PRIVACY_EXPORT, TUTORIAL_VIDEO_CARD] }
            tutorial: { $ref: "#/components/schemas/AiTutorialPayload" }
            guestSellerIntent:
              type: boolean
              description: Guest-only marker allowing same-market seller intent to be resumed after authentication.
            employment:
              type: object
              additionalProperties: true
              description: Allowlisted employment view (jobs, CV profile, candidates, applications, pending action), validated server-side.
            delivery:
              type: object
              additionalProperties: true
              description: >
                Allowlisted delivery/location view for the order's own participant, rebuilt
                server-side on every read. Stored copies never contain coordinates or address text.
            promotion:
              type: object
              additionalProperties: true
              description: >
                Allowlisted seller promotion view (plans, review, campaigns), rebuilt from
                server state on every read. Prices come only from admin plans.
            driver:
              type: object
              additionalProperties: true
              description: >
                Allowlisted driver view (profile, review, coarse work cards, assignments),
                rebuilt from server state on every read. Never contains contacts or coordinates.
            provider:
              type: object
              additionalProperties: true
              description: >
                Allowlisted provider connection view (review, status, safe key prefix).
                Never contains a key, secret or credential hash.
            policyReview:
              type: object
              additionalProperties: true
              description: >
                Policy review card (W02-ULTRA B10): the current version, effective date, legal-review
                status and reading path of each policy that requires acceptance, whether this user
                accepted it, and the review id whose exact versions an acceptance records. Contract
                acceptance only; optional privacy consents are unaffected.
            memory:
              type: object
              additionalProperties: false
              required: [view, groups]
              properties:
                view: { type: string, enum: [MY_INTERESTS, MEMORY_SUMMARY, MEMORY_CONFIRMATION, MEMORY_UPDATED] }
                groups:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    additionalProperties: false
                    required: [label, items]
                    properties:
                      label: { type: string, maxLength: 80 }
                      items:
                        type: array
                        maxItems: 12
                        items:
                          type: object
                          additionalProperties: false
                          required: [topic, label, reason]
                          properties:
                            topic: { type: string, maxLength: 80 }
                            label: { type: string, maxLength: 120 }
                            reason: { type: string, maxLength: 160 }
              description: Private structured memory summary, returned only to the authenticated owner.
            advice:
              type: object
              additionalProperties: true
              description: >
                G2 conversational answer: its class (CONVERSATIONAL_RESPONSE, GROUNDED_ADVICE,
                CLARIFICATION_REQUIRED), the data scope it is grounded in (DINAR_INTERNAL or
                GENERAL_KNOWLEDGE), deterministic statistics and reasons, and an optional topic
                (SPONSORED_PLACEMENT, MARKETING_CLAIMS_BLOCKED with the refused claim kinds,
                MARKETING_COPY for copy grounded in the seller's own listing record).
                Never an action.
            negotiation:
              type: object
              additionalProperties: true
              description: >
                Allowlisted price-negotiation view for one of its two parties (review, status
                or list), rebuilt from the negotiation authority on every read.
            inquiry:
              type: object
              additionalProperties: true
              description: >
                DINAR NEXT G2 buyer–seller inquiry view for one of its two parties (draft review,
                status, incoming message, list, notice), rebuilt from the inquiry authority on every
                read. Messages carry their author role and provenance (BUYER_AUTHORED,
                SELLER_AUTHORED, DINAR_DRAFT_APPROVED) and per-message submitted/delivered/read
                times; delivery is in-app only and external notifications are NOT_CONFIGURED.
                Never contains phone numbers, addresses or the other party's account id.
            control:
              type: object
              additionalProperties: true
              description: >
                Universal product control view (APP_THEME, MARKET_SWITCH_REVIEW/STATUS,
                PROFILE_REVIEW/STATUS, CONTROL_NOTICE, PRIVACY_EXPORT), validated by ProductControlPayload in
                @workspace/api-zod/conversation-runtime. Theme changes are client actions whose
                status (REQUESTED, APPLIED, FAILED) is the device's own acknowledgement; market and
                profile reviews show their pending action's real status. Never contains secrets,
                coordinates or another user's data.
            commerce:
              type: object
              additionalProperties: true
              description: >
                Monetization V3 commercial view (commercial balance, top-up and purchase reviews,
                campaigns and aggregate results, Market Pulse, DINAR Business), and the G1 AI
                usage card (AI_USAGE: plan tier, per-resource requests and tokens consumed in the
                current period, renewal boundary) and plan comparison (AI_PLANS: allowances per
                tier, configured prices or "not configured", billing connection state), rebuilt
                from server state on every read. Never contains buyer identity, ledger keys,
                provider costs or secrets.
            resultSetId: { type: string }
            listings:
              type: array
              items: { $ref: "#/components/schemas/Listing" }
    AiControlActionAcknowledgement:
      type: object
      required: [status]
