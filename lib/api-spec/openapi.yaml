          items: { type: string, minLength: 1, maxLength: 160 }
        query: { type: string, maxLength: 200 }
        resourceIds:
          type: array
          maxItems: 24
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        searchState: { $ref: "#/components/schemas/AiSearchState" }
    AiVoiceRecording:
      type: string
