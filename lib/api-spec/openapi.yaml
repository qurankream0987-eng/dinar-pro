        modelPreference: { type: string, enum: [DEFAULT, PREMIUM_TRIAL, AUTO, ECONOMY, CORE, ADVANCED], description: "Model class the user asks for. DEFAULT and AUTO let Jassim choose the best authorized model; ECONOMY, CORE and ADVANCED are honoured only when the account is eligible; PREMIUM_TRIAL uses one complimentary premium message when available." }
        clientMessageId: { type: string, format: uuid, description: Stable identifier for safe turn retries. }
