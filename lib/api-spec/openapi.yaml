        productType: { type: string, enum: [STANDARD_PROMOTION, FEATURED_LISTING, VIP_LISTING, REFRESH_LISTING, SPONSORED_SEARCH, SPONSORED_RECOMMENDATION, DEMAND_CAPTURE, PROMOTION_BUNDLE, EXTRA_LISTING_QUOTA, DINAR_BUSINESS, SPONSORED_SURFACE] }
        chargingMode: { type: string }
        pricingVersion: { type: integer }
        priceMinor: { type: integer, minimum: 1 }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        durationDays: { type: integer, minimum: 1, maximum: 365 }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PromotionProductInput:
      type: object
      additionalProperties: false
      required: [categoryId, name, placement, priceMinor, durationDays]
      properties:
        categoryId: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
        placement: { type: string, enum: [SEARCH_AND_CHAT] }
        priceMinor: { type: integer, minimum: 1, maximum: 2000000000 }
        durationDays: { type: integer, minimum: 1, maximum: 365 }
        enabled: { type: boolean, default: true }
    PromotionProductUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
