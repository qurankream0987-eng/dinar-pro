    OrderDelivery:
      type: object
      description: Participant-only delivery view of one order (buyer or seller of that order).
      required: [orderId, orderRef, orderStatus, listingTitle, role, capability, options, fulfillment, destination, pickupPoint, serviceLocation, fee, canSelectMethod, canChangeDestination, canSetPickupPoint, nextActions, awaitingHandoff]
      properties:
        orderId: { type: string }
        orderRef: { type: string }
        orderStatus: { type: string }
        listingTitle: { type: string }
        role: { type: string, enum: [BUYER, SELLER] }
        capability: { type: string, enum: [PICKUP_ONLY, SELLER_DELIVERY, SERVICE, NONE] }
        options:
          type: array
          items: { $ref: "#/components/schemas/DeliveryOption" }
        fulfillment:
          type: object
          nullable: true
          required: [method, methodLabel, status, statusLabel, failureReason, failureLabel, version, updatedAt]
          properties:
            method: { type: string, enum: [PICKUP, SELLER_DELIVERY, COURIER, EXTERNAL_PROVIDER] }
            methodLabel: { type: string }
            status: { type: string, enum: [REQUESTED, ACCEPTED, READY_FOR_PICKUP, PICKED_UP, OUT_FOR_DELIVERY, DELIVERED, CANCELLED, FAILED] }
            statusLabel: { type: string }
            failureReason: { type: string, nullable: true, enum: [BUYER_UNAVAILABLE, ADDRESS_UNREACHABLE, SELLER_UNABLE, OTHER, null] }
            failureLabel: { type: string, nullable: true }
            version: { type: integer }
            updatedAt: { type: string }
        destination:
          allOf: [{ $ref: "#/components/schemas/TransactionLocation" }]
          nullable: true
        pickupPoint:
          allOf: [{ $ref: "#/components/schemas/TransactionLocation" }]
          nullable: true
        serviceLocation:
          allOf: [{ $ref: "#/components/schemas/TransactionLocation" }]
          nullable: true
        fee:
          type: object
          required: [implemented, note]
          properties:
            implemented: { type: boolean }
            note: { type: string }
        canSelectMethod: { type: boolean }
        canChangeDestination: { type: boolean }
        canSetPickupPoint: { type: boolean }
        nextActions:
          type: array
          items: { type: string, enum: [ACCEPTED, OUT_FOR_DELIVERY, READY_FOR_PICKUP, CANCELLED, FAILED] }
        awaitingHandoff: { type: boolean }
    OrderTracking:
      type: object
      required: [orderId, orderStatus, delivery, tracking, progress]
      properties:
        orderId: { type: string }
        orderStatus: { type: string }
        delivery:
          type: object
          nullable: true
          required: [method, methodLabel, status, statusLabel, updatedAt]
          properties:
            method: { type: string, enum: [PICKUP, SELLER_DELIVERY, COURIER, EXTERNAL_PROVIDER] }
            methodLabel: { type: string }
            status: { type: string, enum: [REQUESTED, ACCEPTED, READY_FOR_PICKUP, PICKED_UP, OUT_FOR_DELIVERY, DELIVERED, CANCELLED, FAILED] }
            statusLabel: { type: string }
            updatedAt: { type: string, format: date-time }
        tracking:
          oneOf:
            - $ref: "#/components/schemas/OrderTrackingUnavailable"
            - $ref: "#/components/schemas/OrderTrackingStopped"
            - $ref: "#/components/schemas/OrderTrackingLive"
        progress:
          type: array
          items: { $ref: "#/components/schemas/OrderProgressEvent" }
        destination:
          description: The buyer's own pinned delivery point (device-shared coordinates only), returned to the buyer while the delivery is active; never to other parties.
          type: object
          nullable: true
          required: [latitude, longitude]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
    OrderProgressEvent:
      type: object
      required: [type, occurredAt, actorRole]
      properties:
        type: { type: string, enum: [PICKED_UP, OUT_FOR_DELIVERY, ARRIVED, HANDED_OFF, BUYER_RECEIVED] }
        occurredAt: { type: string, format: date-time }
        actorRole: { type: string, enum: [COURIER, BUYER] }
    DriverLocationSharing:
      type: object
      required: [active, consentedAt, lastObservedAt, sequence, endReason]
      properties:
        active: { type: boolean }
        consentedAt: { type: string, format: date-time, nullable: true }
        lastObservedAt: { type: string, format: date-time, nullable: true }
        sequence: { type: integer, minimum: 0 }
        endReason: { type: string, nullable: true, enum: [DRIVER_STOPPED, DELIVERY_ENDED, ASSIGNMENT_ENDED, EXPIRED, null] }
    StartDriverLocationSharingInput:
      type: object
      additionalProperties: false
      required: [consent]
      properties:
        consent: { type: boolean, const: true }
    DriverLocationUpdateInput:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracyMeters, observedAt, sequence]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: number, minimum: 0, maximum: 100000 }
        observedAt: { type: string, format: date-time }
        sequence: { type: integer, minimum: 1 }
    DriverLocationUpdateResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        sequence: { type: integer }
        reason: { type: string, enum: [DUPLICATE_OR_OUT_OF_ORDER, TOO_FREQUENT] }
        retryAfterMs: { type: integer }
    OrderTrackingUnavailable:
      type: object
      required: [state, reason]
      properties:
        state: { type: string, const: UNAVAILABLE }
        reason: { type: string, enum: [NOT_BUYER, NOT_COURIER, NOT_ACTIVE, NO_DRIVER, NO_PROVIDER] }
    OrderTrackingStopped:
      type: object
      required: [state, reason]
      properties:
        state: { type: string, const: STOPPED }
        reason: { type: string, const: ORDER_TERMINAL }
    OrderTrackingLive:
      type: object
      required: [state, position, route, eta]
      properties:
        state: { type: string, enum: [LIVE, STALE] }
        position:
          type: object
          required: [latitude, longitude, observedAt]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
            accuracyMeters: { type: number, minimum: 0, nullable: true }
            observedAt: { type: string, format: date-time }
        route:
          type: object
          nullable: true
          required: [encodedPolyline, observedAt]
          properties:
            encodedPolyline: { type: string, maxLength: 200000 }
            observedAt: { type: string, format: date-time }
        eta:
          type: object
          nullable: true
          required: [arrivalAt, observedAt]
          properties:
            arrivalAt: { type: string, format: date-time }
            observedAt: { type: string, format: date-time }
    AiListingCartAction:
      type: object
      required: [resultSetId, resourceId]
      properties:
        resultSetId: { type: string, format: uuid }
        resourceId: { type: string, minLength: 1, maxLength: 200 }
    AiListingCartActionResponse:
      type: object
      required: [assistantMessage]
      properties:
        assistantMessage: { $ref: "#/components/schemas/AiMessage" }
    AiListingManagementPreviewAction:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [CONFIRM, CANCEL] }
    AiListingManagementPreviewResult:
      type: object
      required: [status, listingId]
      properties:
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED, EXPIRED] }
        listingId: { type: string }
    AiMessage:
      type: object
      required: [id, actor, body, createdAt, blocks]
      properties:
        id: { type: string }
        actor: { type: string, enum: [USER, ASSISTANT, SYSTEM, TOOL] }
        body: { type: string }
        createdAt: { type: string }
        turnStatus:
          type: string
          enum: [pending, completed, failed, uncertain]
          description: Owner-visible server execution state of a user turn; never supplied by the client.
        replyToMessageId:
          type: string
          description: The user message answered by this server-persisted assistant message.
        blocks:
          type: array
          items: { $ref: "#/components/schemas/AiUiBlock" }
        actionReceipts:
          type: array
          maxItems: 12
          description: >
            The commercial actions this turn opened or moved, as recorded by DINAR's action
            ledger and re-read on every response: the status is the ledger's current one, never
            the assistant's text. Only the viewer's own actions in this conversation appear.
          items: { $ref: "#/components/schemas/AiActionReceipt" }
    AiActionReceipt:
      type: object
      additionalProperties: false
      required: [action, lifecycle, title, requiresConfirmation]
      properties:
        action: { type: string, maxLength: 40 }
        lifecycle:
          type: string
          enum: [PROPOSED, REQUIRES_CONFIRMATION, EXECUTING, SUCCEEDED, FAILED, UNKNOWN]
        outcome:
          type: string
          description: Why a FAILED action did not complete.
          enum: [REJECTED, CANCELLED, EXPIRED, SUPERSEDED]
        title: { type: string, maxLength: 120 }
        resource: { type: string, maxLength: 160 }
        amount:
          type: object
          additionalProperties: false
          required: [value, currency, kind]
          properties:
            value: { type: string, maxLength: 24 }
            currency: { type: string, maxLength: 8 }
            kind: { type: string, enum: [PROPOSED, SUBMITTED, AGREED, PAYMENT] }
        orderId: { type: string, maxLength: 64 }
        paymentState: { type: string, enum: [AWAITING_CONFIRMATION, SIMULATED_CAPTURED, CAPTURED] }
        nextStep: { type: string, maxLength: 200 }
        requiresConfirmation: { type: boolean }
        failure: { type: string, maxLength: 240 }
    AiUiBlock:
      type: object
      required: [type, version, payload]
      properties:
        type: { type: string, enum: [LISTING_RESULTS, SURFACE] }
        version: { type: integer, enum: [1] }
        payload:
          type: object
          required: [resultSetId, listings]
          properties:
            draft: { type: object, additionalProperties: true }
            draftStep: { type: string }
            draftReview:
              type: object
              additionalProperties: true
              description: >
                Typed seller draft review built by the server: each value with its provenance
                (USER_DECLARED, IMAGE_INFERRED, DINAR_DERIVED, SERVER_FACT, UNKNOWN), image
                guesses marked as needing confirmation, every missing required field, and the
                allowed actions (PUBLISH only when nothing is missing, EDIT, CANCEL).
            comparison:
              type: object
              additionalProperties: true
              description: Current server facts of the compared listings side by side; values the seller did not state are null ("غير معروف").
            purchaseReview:
              type: object
              additionalProperties: true
              description: Review of a pending, confirm-only selection (adds to cart after re-reading price, stock and account); never pays.
            card:
              type: object
              additionalProperties: true
              description: >
                The versioned card envelope the server decides for this block (schemaVersion 1):
                surface type and identity, resource, conversation, market context, lifecycle,
                allowed actions, pending review, expiry, refresh strategy, source timestamp and
                accessibility label. The client validates it before rendering and never invents
                an action the server did not allow.
            sellerInsight:
              type: object
              additionalProperties: true
              description: >
                Seller insight from DINAR-internal facts only: price comparables (count, range,
                median), listing factors phrased as possibilities (never as causes), or a
                BUSINESS_SUMMARY of the seller's own stock, order counts or per-listing results
                (shape: SellerBusinessInsight in @workspace/api-zod/conversation-runtime).
            attributes: { type: object, additionalProperties: true }
            resourceIds: { type: array, items: { type: string } }
            resourceId: { type: string }
            sellerContactRequested:
              type: boolean
              description: A request marker only; the number is retrieved separately through the order-authorized no-store endpoint.
            hideMap: { type: boolean }
            searchState: { $ref: "#/components/schemas/AiSearchState" }
            presentation:
              type: string
              enum: [RESULTS, DETAILS]
              description: DETAILS marks one result opened from the conversation's current result set.
            composition:
              type: object
              description: Generative UI. The server-resolved layout of a listing block, proposed by the model and validated against this block's own verified result set; a highlight is a labelled suggestion and never a sponsored listing.
              required: [source, layout]
              additionalProperties: false
              properties:
                source: { type: string, enum: [MODEL_PROPOSAL] }
                layout: { type: string, enum: [GRID, CAROUSEL, LIST, TABLE] }
                highlightId: { type: string, minLength: 1, maxLength: 200 }
            photoSuggestionStatus:
              type: string
              enum: [UNAVAILABLE, FAILED, NO_SUGGESTIONS, SUGGESTIONS]
            photoSuggestions:
              type: array
              maxItems: 12
              items: { $ref: "#/components/schemas/AiPhotoSuggestion" }
            managementPreview:
              type: object
              required: [previewId, action, listingId, listingTitle, fieldLabel, beforeValue, afterValue, status]
              properties:
                previewId: { type: string, format: uuid }
                action: { type: string, enum: [UPDATE, PAUSE, RESUME, ARCHIVE] }
                listingId: { type: string }
                listingTitle: { type: string }
                fieldLabel: { type: string }
                beforeValue: { type: string }
                afterValue: { type: string }
                status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED, EXPIRED] }
            surface: { type: string, enum: [CONNECT_RESULTS, CAPABILITIES, POLICIES, CART, CHECKOUT, AUTH, SETTINGS, ORDERS, ORDER, ORDERS_LIST, ORDER_SELECTOR, ORDER_STATUS, ORDER_TRACKING, SELL, MY_LISTINGS, DUES, MARKET, MARKET_SELECTOR, ACCOUNT, LOGOUT, CLARIFY, UNSUPPORTED, JOB_DRAFT, JOB_REVIEW, JOB_SEARCH_RESULTS, JOB_DETAILS, MY_JOBS, CV_PROFILE, CANDIDATE_SEARCH_RESULTS, CANDIDATE_DETAILS, APPLICATION_REVIEW, MY_APPLICATIONS, APPLICATION_LIST, EMPLOYMENT_ACTION, EMPLOYMENT_NOTICE, LOCATION_PERMISSION_REQUEST, LOCATION_PREVIEW, LOCATION_CONFIRMED, MANUAL_ADDRESS, DELIVERY_OPTIONS, DELIVERY_SUMMARY, DELIVERY_ACTION, DELIVERY_STATUS, PICKUP_DETAILS, DELIVERY_NOTICE, PROMOTION_OPTIONS, PROMOTION_REVIEW, PROMOTION_STATUS, MY_PROMOTIONS, PROMOTION_DETAILS, COMPARISON, PURCHASE_REVIEW, PAYMENT_REVIEW, DRIVER_ONBOARDING, DRIVER_ONBOARDING_REVIEW, DRIVER_STATUS, DRIVER_AVAILABILITY, DELIVERY_WORK_RESULTS, DRIVER_ASSIGNMENT_REVIEW, DRIVER_ASSIGNMENT_STATUS, DRIVER_EARNINGS_HISTORY, PROVIDER_CONNECTION_REVIEW, PROVIDER_SECRET_ONCE, PROVIDER_STATUS, ADVICE, NEGOTIATION_REVIEW, NEGOTIATION_STATUS, NEGOTIATION_LIST, MY_INTERESTS, MEMORY_SUMMARY, MEMORY_CONFIRMATION, MEMORY_UPDATED, COMMERCIAL_BALANCE, COMMERCIAL_LEDGER_SUMMARY, COMMERCIAL_TOPUP_REVIEW, COMMERCIAL_PRODUCTS, COMMERCIAL_PRODUCT_REVIEW, FEATURED_REVIEW, VIP_REVIEW, REFRESH_REVIEW, BUNDLE_REVIEW, BUNDLE_STATUS, PROMOTION_TYPE_OPTIONS, DEMAND_CAPTURE_REVIEW, CAMPAIGN_STATUS, CAMPAIGN_ANALYTICS, MARKET_PULSE, MARKET_OPPORTUNITY, BUSINESS_PLAN_REVIEW, BUSINESS_STATUS, BUSINESS_SETUP, BUSINESS_PROFILE_REVIEW, BUSINESS_PROFILE, BUSINESS_CATALOG, BUSINESS_CATALOG_DRAFT, BUSINESS_LISTING_REVIEW, BUSINESS_ORDERS, BUSINESS_INSIGHTS, COMMERCE_NOTICE, AI_USAGE, AI_PLANS, INQUIRY_DRAFT, INQUIRY_STATUS, INQUIRY_INCOMING, INQUIRY_LIST, INQUIRY_NOTICE, APP_THEME, MARKET_SWITCH_REVIEW, MARKET_SWITCH_STATUS, PROFILE_REVIEW, PROFILE_STATUS, CONTROL_NOTICE, PRIVACY_EXPORT, TUTORIAL_VIDEO_CARD] }
            tutorial: { $ref: "#/components/schemas/AiTutorialPayload" }
            guestSellerIntent:
              type: boolean
              description: Guest-only marker allowing same-market seller intent to be resumed after authentication.
            employment:
              type: object
              additionalProperties: true
              description: Allowlisted employment view (jobs, CV profile, candidates, applications, pending action), validated server-side.
            delivery:
              type: object
              additionalProperties: true
              description: >
                Allowlisted delivery/location view for the order's own participant, rebuilt
                server-side on every read. Stored copies never contain coordinates or address text.
            promotion:
              type: object
              additionalProperties: true
              description: >
                Allowlisted seller promotion view (plans, review, campaigns), rebuilt from
                server state on every read. Prices come only from admin plans.
            driver:
              type: object
              additionalProperties: true
              description: >
                Allowlisted driver view (profile, review, coarse work cards, assignments),
                rebuilt from server state on every read. Never contains contacts or coordinates.
            universalCards: { $ref: "#/components/schemas/ConnectUniversalCardsPayload" }
            displaySurface:
              type: object
              additionalProperties: true
              description: >
                Phase 2 model-driven display. A server-composed card (ComposedSurface) of the
                actor's own verified figures in the form the model chose; built from server
                records only and validated again by the client before rendering.
            provider:
              type: object
              additionalProperties: true
              description: >
                Allowlisted provider connection view (review, status, safe key prefix).
                Never contains a key, secret or credential hash.
            business:
              type: object
              additionalProperties: true
              description: >
                Allowlisted D3-A business view (setup, profile, catalog, orders, insights),
                refreshed from the owner's live D2 identity and D3 operating rows on every read.
            policyReview:
              type: object
              additionalProperties: true
              description: >
                Policy review card (W02-ULTRA B10): the current version, effective date, legal-review
                status and reading path of each policy that requires acceptance, whether this user
                accepted it, and the review id whose exact versions an acceptance records. Contract
                acceptance only; optional privacy consents are unaffected.
            memory:
              type: object
              additionalProperties: false
              required: [view, groups]
              properties:
                view: { type: string, enum: [MY_INTERESTS, MEMORY_SUMMARY, MEMORY_CONFIRMATION, MEMORY_UPDATED] }
                groups:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    additionalProperties: false
                    required: [label, items]
                    properties:
                      label: { type: string, maxLength: 80 }
                      items:
                        type: array
                        maxItems: 12
                        items:
                          type: object
                          additionalProperties: false
                          required: [topic, label, reason]
                          properties:
                            topic: { type: string, maxLength: 80 }
                            label: { type: string, maxLength: 120 }
                            reason: { type: string, maxLength: 160 }
              description: Private structured memory summary, returned only to the authenticated owner.
            advice:
              type: object
              additionalProperties: true
              description: >
                G2 conversational answer: its class (CONVERSATIONAL_RESPONSE, GROUNDED_ADVICE,
                CLARIFICATION_REQUIRED), the data scope it is grounded in (DINAR_INTERNAL or
                GENERAL_KNOWLEDGE), deterministic statistics and reasons, and an optional topic
                (SPONSORED_PLACEMENT, MARKETING_CLAIMS_BLOCKED with the refused claim kinds,
                MARKETING_COPY for copy grounded in the seller's own listing record).
                Never an action.
            negotiation:
              type: object
              additionalProperties: true
              description: >
                Allowlisted price-negotiation view for one of its two parties (review, status
                or list), rebuilt from the negotiation authority on every read.
            inquiry:
              type: object
              additionalProperties: true
              description: >
                DINAR NEXT G2 buyer–seller inquiry view for one of its two parties (draft review,
                status, incoming message, list, notice), rebuilt from the inquiry authority on every
                read. Messages carry their author role and provenance (BUYER_AUTHORED,
                SELLER_AUTHORED, DINAR_DRAFT_APPROVED) and per-message submitted/delivered/read
                times; delivery is in-app only and external notifications are NOT_CONFIGURED.
                Never contains phone numbers, addresses or the other party's account id.
            control:
              type: object
              additionalProperties: true
              description: >
                Universal product control view (APP_THEME, MARKET_SWITCH_REVIEW/STATUS,
                PROFILE_REVIEW/STATUS, CONTROL_NOTICE, PRIVACY_EXPORT), validated by ProductControlPayload in
                @workspace/api-zod/conversation-runtime. Theme changes are client actions whose
                status (REQUESTED, APPLIED, FAILED) is the device's own acknowledgement; market and
                profile reviews show their pending action's real status. Never contains secrets,
                coordinates or another user's data.
            commerce:
              type: object
              additionalProperties: true
              description: >
                Monetization V3 commercial view (commercial balance, top-up and purchase reviews,
                campaigns and aggregate results, Market Pulse, DINAR Business), and the G1 AI
                usage card (AI_USAGE: plan tier, per-resource requests and tokens consumed in the
                current period, renewal boundary) and plan comparison (AI_PLANS: allowances per
                tier, configured prices or "not configured", billing connection state), rebuilt
                from server state on every read. Never contains buyer identity, ledger keys,
                provider costs or secrets.
            resultSetId: { type: string }
            listings:
              type: array
              items: { $ref: "#/components/schemas/Listing" }
    AiControlActionAcknowledgement:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [APPLIED, FAILED] }
    AiControlActionAcknowledgementResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [REQUESTED, APPLIED, FAILED] }
    AiEmploymentActionRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [CONFIRM, CANCEL] }
    AiEmploymentActionResult:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [CONFIRMED, CANCELLED, EXPIRED] }
        message: { type: string }
    AiPromotionActionResult:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [CONFIRMED, CANCELLED, EXPIRED, REJECTED] }
        message: { type: string }
        promotionId: { type: string }
    AiSearchState:
      type: object
      required: [search, filters]
      properties:
        search: { type: string, maxLength: 200 }
        categoryId: { type: string, maxLength: 80 }
        filters:
          type: array
          maxItems: 12
          items:
            type: object
            required: [field, operator, value]
            properties:
              field: { type: string, minLength: 1, maxLength: 80 }
              operator: { type: string, enum: [eq, ne, contains, gt, gte, lt, lte] }
              value:
                anyOf:
                  - { type: string, maxLength: 200 }
                  - { type: number }
        sort: { type: string, enum: [RELEVANCE, PRICE_ASC, PRICE_DESC, NEWEST, YEAR_ASC, YEAR_DESC, MILEAGE_ASC, MILEAGE_DESC, PROPERTY_SIZE_ASC, PROPERTY_SIZE_DESC] }
    AiPhotoSuggestion:
      type: object
      required: [field, value, confidence, imageObjectPath]
      properties:
        field: { type: string, minLength: 1, maxLength: 80 }
        value:
          anyOf:
            - { type: string, maxLength: 160 }
            - { type: number }
        confidence: { type: number, minimum: 0, maximum: 1 }
        imageObjectPath: { type: string, minLength: 1, maxLength: 500 }
    AiTutorialPayload:
      type: object
      additionalProperties: false
      required: [id, title, caption, steps, animation]
      properties:
        id:
          type: string
          enum: [SELL_FIRST_LISTING, PHOTO_FIRST_SELLING, PROMOTION_OVERVIEW, FEATURED_EXPLAINER, VIP_EXPLAINER, DEMAND_CAPTURE_EXPLAINER]
        title: { type: string, minLength: 1, maxLength: 120 }
        caption: { type: string, minLength: 1, maxLength: 300 }
        animation: { type: string, enum: [LOCAL_STEP_SEQUENCE] }
        steps:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [title, description]
            properties:
              title: { type: string, minLength: 1, maxLength: 100 }
              description: { type: string, minLength: 1, maxLength: 240 }
    AiConversationHistory:
      type: object
      required: [conversation, messages]
      properties:
        conversation: { $ref: "#/components/schemas/AiConversation" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/AiMessage" }
    TutorialLearningEventInput:
      type: object
