components:
  schemas:
    BusinessDelegationConfirmation:
      type: object
      additionalProperties: false
      required: [confirm, expectedVersion]
      properties:
        confirm: { type: boolean, enum: [true] }
        expectedVersion: { type: integer, minimum: 1 }
    BusinessDelegationInput:
      type: object
      additionalProperties: false
      required: [employee, capabilities, resourceScope, expiresAt, idempotencyKey]
      properties:
        employee:
          oneOf:
            - $ref: "#/components/schemas/BusinessHumanEmployee"
            - $ref: "#/components/schemas/BusinessIntelligentEmployee"
        capabilities:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
              - business.catalog.read
              - business.catalog.draft
              - business.catalog.draft.price
              - business.inventory.read
              - business.orders.read
              - business.inquiries.reply
              - business.messages.send
              - business.negotiations.escalate
        resourceScope:
          oneOf:
            - $ref: "#/components/schemas/BusinessWideDelegationScope"
            - $ref: "#/components/schemas/BusinessListingDelegationScope"
        expiresAt: { type: string, format: date-time }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
    BusinessHumanEmployee:
      type: object
      additionalProperties: false
      required: [type, userId]
      properties:
        type: { type: string, enum: [HUMAN] }
        userId: { type: string, format: uuid }
    BusinessIntelligentEmployee:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [INTELLIGENT] }
    BusinessWideDelegationScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [BUSINESS] }
    BusinessListingDelegationScope:
      type: object
      additionalProperties: false
      required: [kind, listingIds]
      properties:
        kind: { type: string, enum: [LISTING_ALLOWLIST] }
        listingIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
    BusinessDelegationList:
      type: object
      additionalProperties: false
      required: [delegations, policyVersion]
      properties:
        policyVersion: { type: string }
        delegations: { type: array, items: { $ref: "#/components/schemas/BusinessDelegation" } }
    BusinessDelegationResult:
      type: object
      additionalProperties: false
      required: [created, delegation]
      properties:
        created: { type: boolean }
        delegation: { $ref: "#/components/schemas/BusinessDelegation" }
    BusinessDelegation:
      type: object
      additionalProperties: false
      required: [id, businessId, marketId, employee, capabilities, resourceScope, approvalRequiredCapabilities, status, policyVersion, version, createdAt, activatedAt, expiresAt, revokedAt, expiredAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        marketId: { type: string }
        employee:
          oneOf:
            - $ref: "#/components/schemas/BusinessHumanEmployeeView"
            - $ref: "#/components/schemas/BusinessIntelligentEmployeeView"
        capabilities:
          type: array
          items:
            type: string
            enum:
              - business.catalog.read
              - business.catalog.draft
              - business.catalog.draft.price
              - business.inventory.read
              - business.orders.read
              - business.inquiries.reply
              - business.messages.send
              - business.negotiations.escalate
        resourceScope:
          oneOf:
            - $ref: "#/components/schemas/BusinessWideDelegationScope"
            - $ref: "#/components/schemas/BusinessListingDelegationScope"
        approvalRequiredCapabilities:
          type: array
          items:
            type: string
            enum:
              - business.catalog.draft
              - business.catalog.draft.price
              - business.inquiries.reply
              - business.messages.send
              - business.negotiations.escalate
        status: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, REVOKED, EXPIRED] }
        policyVersion: { type: string }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: ["string", "null"], format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        expiredAt: { type: ["string", "null"], format: date-time }
    BusinessHumanEmployeeView:
      type: object
      additionalProperties: false
      required: [type, userId]
      properties:
        type: { type: string, enum: [HUMAN] }
        userId: { type: ["string", "null"], format: uuid }
    BusinessIntelligentEmployeeView:
      type: object
      additionalProperties: false
      required: [type, configurationId]
      properties:
        type: { type: string, enum: [INTELLIGENT] }
        configurationId: { type: ["string", "null"], format: uuid }
    DelegatedBusinessCatalog:
      type: object
      additionalProperties: false
      required: [businessId, businessName, policyVersion, listings]
      properties:
        businessId: { type: string, format: uuid }
        businessName: { type: string }
        policyVersion: { type: string }
        listings:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, title, category, priceMinor, pricingMode]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              category: { type: ["string", "null"] }
              priceMinor: { type: ["integer", "null"] }
              pricingMode: { type: string, enum: [FIXED, NEGOTIABLE, OPEN_TO_OFFERS] }
    BusinessListingLinkRequest:
      type: object
      additionalProperties: false
      required: [linked]
      properties:
        linked: { type: boolean }
    ServerValidatedObject:
      type: object
      additionalProperties: true
      description: "W07–W10 request/response object. Each route validates its body with a strict server-side schema (unknown keys, owners, amounts and statuses from the client are refused); the response is the server's own view."
    EmptyObject:
      type: object
      additionalProperties: false
    SubscriptionCheckoutRequest:
      type: object
      additionalProperties: false
      required: [planId, idempotencyKey]
      properties:
        planId: { type: string, maxLength: 80 }
        idempotencyKey: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
        businessId: { type: string, format: uuid }
    SubscriptionUsageResource:
      type: object
      additionalProperties: false
      required: [resource, label, limit, used, inProgress, remaining, percent, included]
      properties:
        resource: { type: string, enum: [TEXT_REQUEST, MARKETING_GENERATION, BUSINESS_ANALYTICS, IMAGE_UNDERSTANDING, AGENT_MULTI_STEP, AUDIO_TRANSCRIPTION] }
        label: { type: string }
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        inProgress: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
        percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        included: { type: boolean }
    SubscriptionUsageTokens:
      type: object
      additionalProperties: false
      required: [limit, used, remaining, percent]
      properties:
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
        percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
    SubscriptionUsage:
      type: object
      additionalProperties: false
      required: [tier, renewsAt, timeZone, resources, tokens]
      properties:
        tier: { type: string, enum: [GUEST, FREE, BUSINESS_GO, BUSINESS_PRO] }
        renewsAt: { type: string, format: date-time }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        resources:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/SubscriptionUsageResource" }
        tokens: { $ref: "#/components/schemas/SubscriptionUsageTokens" }
        premiumTrial:
          type: object
          additionalProperties: false
          required: [eligible, enabled, limit, used, inProgress, remaining, status]
          properties:
            eligible: { type: boolean }
            enabled: { type: boolean }
            limit: { type: integer, minimum: 0, maximum: 15 }
            used: { type: integer, minimum: 0, maximum: 15 }
            inProgress: { type: integer, minimum: 0, maximum: 15 }
            remaining: { type: integer, minimum: 0, maximum: 15 }
            status: { type: string, enum: [NOT_ELIGIBLE, DISABLED, AVAILABLE, EXHAUSTED] }
    SubscriptionPlanApprovals:
      type: object
      additionalProperties: false
      required: [plansApproved, allowancesApproved, note]
      properties:
        plansApproved: { type: boolean }
        allowancesApproved: { type: boolean }
        note: { type: ["string", "null"] }
    SubscriptionPlansOverview:
      type: object
      additionalProperties: true
      required: [marketId, currentPlan, currentPlanLabel, plans, usage, approvals, billing]
      properties:
        marketId: { type: string }
        currentPlan: { type: string, enum: [FREE, DINAR_GO, DINAR_PRO, DINAR_BUSINESS] }
        currentPlanLabel: { type: string }
        plans:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: true
            required: [planCode, name, referencePriceLabel, requiresVerifiedBusiness, eligible, current]
            properties:
              planCode: { type: string, enum: [DINAR_GO, DINAR_PRO, DINAR_BUSINESS] }
              name: { type: string }
              referencePriceLabel: { type: string }
              requiresVerifiedBusiness: { type: boolean }
              eligible: { type: boolean }
              current: { type: boolean }
        usage: { $ref: "#/components/schemas/SubscriptionUsage" }
        approvals: { $ref: "#/components/schemas/SubscriptionPlanApprovals" }
        billing:
          type: object
          additionalProperties: true
          required: [status, activation, simulationAvailable, canActivate, note]
          properties:
            status: { type: string, enum: [CONNECTED, NOT_CONNECTED] }
            activation: { type: string, enum: [DISABLED] }
            simulationAvailable: { type: boolean }
            canActivate: { type: boolean }
            note: { type: string }
    BusinessDraftRequest:
      type: object
      additionalProperties: false
      required: [displayName, categoryKey, idempotencyKey]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 120 }
        categoryKey: { type: string, enum: [RESTAURANT, GRILL_RESTAURANT, CAFE, BAKERY, GROCERY, RETAIL, FASHION, ELECTRONICS, BEAUTY, AUTOMOTIVE, HOME_SERVICES, SERVICES, OTHER] }
        description: { type: string, maxLength: 1000 }
        legalName: { type: string, minLength: 2, maxLength: 200 }
        legalForm: { type: string, enum: [SOLE_PROPRIETORSHIP, COMPANY, PARTNERSHIP, OTHER] }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        idempotencyKey: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
    BusinessAddress:
      type: object
      additionalProperties: false
      properties:
        city: { type: string, maxLength: 60 }
        area: { type: string, maxLength: 60 }
        line: { type: string, maxLength: 160 }
    BusinessUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        categoryKey: { type: string }
        description: { type: string, maxLength: 1000 }
        legalName: { type: string, minLength: 2, maxLength: 200 }
        legalForm: { type: string, enum: [SOLE_PROPRIETORSHIP, COMPANY, PARTNERSHIP, OTHER] }
        registrationNumber: { type: string, minLength: 4, maxLength: 60 }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        contact:
          type: object
          additionalProperties: false
          properties:
            phone: { type: string, maxLength: 20 }
            email: { type: string, format: email, maxLength: 160 }
            website: { type: string, format: uri, maxLength: 200 }
        openingHours:
          type: array
          maxItems: 21
          items:
            type: object
            additionalProperties: false
            required: [day, opens, closes]
            properties:
              day: { type: integer, minimum: 0, maximum: 6 }
              opens: { type: string, pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$" }
              closes: { type: string, pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$" }
        servicePreferences:
          type: object
          additionalProperties: false
          properties:
            delivery: { type: boolean }
            pickup: { type: boolean }
            dineIn: { type: boolean }
            inquiries: { type: string, enum: [OPEN, CLOSED] }
    BusinessDocumentUploadRequest:
      type: object
      additionalProperties: false
      required: [kind, contentType, size, idempotencyKey]
      properties:
        kind: { type: string, enum: [COMMERCIAL_REGISTRATION, COMMERCIAL_LICENSE, MUNICIPALITY_LICENSE, AUTHORIZATION_LETTER, OWNER_IDENTITY] }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        idempotencyKey: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
    BusinessDocumentUploadTicket:
      type: object
      additionalProperties: false
      required: [documentId, uploadURL, expiresInSeconds, maxBytes]
      properties:
        documentId: { type: string, format: uuid }
        uploadURL: { type: string }
        expiresInSeconds: { type: integer }
        maxBytes: { type: integer }
    BusinessPublicationRequest:
      type: object
      additionalProperties: false
      required: [publish]
      properties:
        publish: { type: boolean }
    BusinessIntegrationRequest:
      type: object
      additionalProperties: false
      required: [kind, systemName, scopes]
      properties:
        kind: { type: string, enum: [POS, ONLINE_STORE, ACCOUNTING, DELIVERY_PLATFORM, CUSTOM_API] }
        systemName: { type: string, minLength: 2, maxLength: 80 }
        endpointUrl: { type: string, maxLength: 300 }
        scopes: { type: array, minItems: 1, maxItems: 3, items: { type: string, enum: [CATALOG_READ, ORDERS_READ, INVENTORY_READ] } }
    BusinessReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expectedRevision]
      properties:
        decision: { type: string, enum: [VERIFY, REJECT, REQUEST_DOCUMENTS, SUSPEND, REINSTATE] }
        reason: { type: string, maxLength: 500 }
        expectedRevision: { type: integer, minimum: 1 }
    BusinessDraftResult:
      type: object
      additionalProperties: false
      required: [created, business]
      properties:
        created: { type: boolean }
