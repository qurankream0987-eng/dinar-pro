            allowedModes:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [FIXED, NEGOTIABLE, OPEN_TO_OFFERS] }
            defaultMode: { type: string, enum: [FIXED, NEGOTIABLE, OPEN_TO_OFFERS] }
            minAmountMinor: { type: integer, minimum: 1 }
            maxAmountMinor: { type: integer, minimum: 1 }
        inventory:
          type: object
          required: [semantics, allowedModes, defaultMode]
          properties:
            semantics: { type: string, enum: [TRACKED, SINGLE, NON_STOCK] }
            allowedModes:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [LIMITED, UNLIMITED] }
            defaultMode: { type: string, enum: [LIMITED, UNLIMITED] }
            defaultQuantity: { type: integer, minimum: 1, maximum: 1000000 }
        sellerDraft:
          type: object
          required: [requiredFields]
          properties:
            requiredFields:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [TITLE, DESCRIPTION, PRICE, ATTRIBUTES, INVENTORY, FULFILMENT, LOCATION, CONTACT] }
