  /listings/{id}/promotions:
    post:
      operationId: confirmListingPromotion
      tags: [marketplace]
      summary: Explicitly confirm and buy a promotion through the simulated (TEST_NO_TRANSFER) payment authority
      description: >
        The price, currency, duration and placement come only from the admin plan and are
        snapshotted. Activation requires a captured simulated payment verified by the test
        adapter's signature; no real money moves and no order, commission, seller-dues or
        delivery record is created. Retrying with the same idempotencyKey returns the same
        campaign. Disabled outside development and test environments.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionConfirmInput" }
      responses:
        "200":
          description: Replay of an earlier purchase with the same idempotencyKey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerPromotion" }
        "201":
          description: Campaign with immutable plan snapshots; ACTIVE after a captured simulated payment, PAYMENT_FAILED otherwise
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerPromotion" }
        "400":
          description: Explicit confirmation is required
        "401":
          description: Sign-in required
        "403":
          description: Simulated promotions are disabled outside development and test
        "503":
          description: Promotion feature is disabled in this environment
        "404":
          description: Listing or market-scoped plan not found
        "409":
          description: Listing is not eligible, already has a live promotion, or the idempotencyKey was used for another request
