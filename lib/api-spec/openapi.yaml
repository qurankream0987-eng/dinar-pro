        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialJsonObject" }
  /admin/markets/{marketId}/commercial-products:
    get:
      operationId: getAdminCommercialProducts
      tags: [commercial]
      parameters:
        - { name: marketId, in: path, required: true, schema: { type: string } }
      summary: "All commercial products of a market (admin)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialJsonObject" }
    post:
      operationId: createAdminCommercialProduct
      tags: [commercial]
      parameters:
        - { name: marketId, in: path, required: true, schema: { type: string } }
      summary: "Create a versioned commercial product (admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommercialJsonObject" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialJsonObject" }
  /admin/commercial-products/{id}:
    patch:
      operationId: updateAdminCommercialProduct
      tags: [commercial]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      summary: "Enable or disable new sales of a commercial product (admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommercialJsonObject" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialJsonObject" }
  /admin/commercial-policies:
    get:
      operationId: getAdminCommercialPolicies
      tags: [commercial]
      summary: "Versioned commercial policy (admin)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialJsonObject" }
    post:
      operationId: createAdminCommercialPolicy
      tags: [commercial]
      summary: "Create a new commercial policy version (admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommercialJsonObject" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialJsonObject" }
  /admin/commercial-credits:
    post:
      operationId: grantAdminCommercialCredit
      tags: [commercial]
      summary: "Grant promotional commercial credit (kept apart from paid credit)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommercialJsonObject" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialJsonObject" }
  /admin/commercial-refunds:
    post:
      operationId: refundAdminCommercialEntry
      tags: [commercial]
      summary: "Refund a commercial ledger charge back to commercial credit (no real money)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommercialJsonObject" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialJsonObject" }
  /admin/markets/{marketId}/commercial-summary:
    get:
      operationId: getAdminCommercialSummary
      tags: [commercial]
      parameters:
        - { name: marketId, in: path, required: true, schema: { type: string } }
      summary: "Commercial revenue by product, reserved budgets, GMV and commission kept apart, attribution and Market Pulse health (admin)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialJsonObject" }
components:
  schemas:
    CommercialJsonObject:
      type: object
      additionalProperties: true
      description: Commercial economy request/response object; bodies are validated strictly on the server and never accept owners, prices, balances or paid flags.
    PhoneVerificationChallengeRequest:
      type: object
      additionalProperties: false
      required: [phoneCountryCode, phoneNumber]
      properties:
        phoneCountryCode: { type: string, minLength: 2, maxLength: 5 }
        phoneNumber: { type: string, minLength: 1, maxLength: 100 }
    PhoneVerificationChallengeResponse:
      type: object
      required: [challengeId, expiresAt]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        developmentCode: { type: string, pattern: "^[0-9]{6}$" }
    PhoneVerificationCodeRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: "^[0-9]{6}$" }
    PhoneVerificationCodeResponse:
      type: object
      required: [verificationToken]
      properties:
        verificationToken: { type: string, pattern: "^[a-f0-9]{64}$" }
    AuthRegisterRequest:
      type: object
      additionalProperties: false
      required: [displayName, phoneCountryCode, phoneNumber, accountCountry, password, confirmPassword, acceptTerms]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
        phoneCountryCode: { type: string, minLength: 2, maxLength: 5 }
        phoneNumber: { type: string, minLength: 1, maxLength: 100 }
        accountCountry: { type: string, minLength: 2, maxLength: 2 }
        password: { type: string, minLength: 12, maxLength: 128 }
        confirmPassword: { type: string, minLength: 12, maxLength: 128 }
        acceptTerms: { type: boolean, enum: [true] }
        verificationToken:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Required outside development; omitted development registrations create accounts that remain phone-unverified.
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required: [phoneCountryCode, phoneNumber, password]
      properties:
        phoneCountryCode: { type: string, minLength: 2, maxLength: 5 }
        phoneNumber: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 128 }
        verificationToken: { type: string, pattern: "^[a-f0-9]{64}$" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          required: [database, migrations, configuration, phoneVerification]
          properties:
            database: { type: string, enum: [ready, unavailable] }
            migrations:
              type: string
              enum: [current, pending, unavailable, unchecked]
            configuration: { type: string, enum: [ready, invalid] }
            phoneVerification: { type: string, enum: [ready, not_configured] }
    CategoryAttributeDefinition:
      type: object
      required: [label, type, operators]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [string, number] }
        operators:
          type: array
          minItems: 1
          items: { type: string, enum: [eq, contains, gt, gte, lt, lte] }
        requiredForPublish: { type: boolean }
        searchable: { type: boolean }
        filterable: { type: boolean }
        minimum: { type: number }
        maximum: { type: number }
        maxLength: { type: integer, minimum: 1, maximum: 500 }
        options: { type: array, items: { type: string, maxLength: 160 } }
    MarketplaceSortDefinition:
      type: object
      required: [id, label, field, direction]
      properties:
        id: { type: string, enum: [PRICE_ASC, PRICE_DESC, NEWEST, YEAR_ASC, YEAR_DESC, MILEAGE_ASC, MILEAGE_DESC, PROPERTY_SIZE_ASC, PROPERTY_SIZE_DESC] }
        label: { type: string, minLength: 1, maxLength: 80 }
        field: { type: string, enum: [PRICE, CREATED_AT, ATTRIBUTE] }
        direction: { type: string, enum: [ASC, DESC] }
        attribute: { type: string, maxLength: 80 }
    MarketplaceCategoryRules:
      type: object
      required: [display, sorting, pricing, inventory, sellerDraft]
      properties:
        display:
          type: object
          required: [cardAttributes, detailAttributes]
          properties:
            cardAttributes: { type: array, uniqueItems: true, items: { type: string, maxLength: 80 } }
            detailAttributes: { type: array, uniqueItems: true, items: { type: string, maxLength: 80 } }
        sorting:
          type: object
          required: [defaultSort, options]
          properties:
            defaultSort: { type: string, enum: [PRICE_ASC, PRICE_DESC, NEWEST, YEAR_ASC, YEAR_DESC, MILEAGE_ASC, MILEAGE_DESC, PROPERTY_SIZE_ASC, PROPERTY_SIZE_DESC] }
            options:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/MarketplaceSortDefinition" }
        pricing:
          type: object
          required: [allowedModes, defaultMode, minAmountMinor, maxAmountMinor]
          properties:
            allowedModes:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [FIXED, NEGOTIABLE, OPEN_TO_OFFERS] }
            defaultMode: { type: string, enum: [FIXED, NEGOTIABLE, OPEN_TO_OFFERS] }
            minAmountMinor: { type: integer, minimum: 1 }
            maxAmountMinor: { type: integer, minimum: 1 }
        inventory:
          type: object
          required: [semantics, allowedModes, defaultMode]
          properties:
            semantics: { type: string, enum: [TRACKED, SINGLE, NON_STOCK] }
            allowedModes:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [LIMITED, UNLIMITED] }
            defaultMode: { type: string, enum: [LIMITED, UNLIMITED] }
            defaultQuantity: { type: integer, minimum: 1, maximum: 1000000 }
        sellerDraft:
          type: object
          required: [requiredFields]
          properties:
            requiredFields:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [TITLE, DESCRIPTION, PRICE, ATTRIBUTES, INVENTORY, FULFILMENT, LOCATION, CONTACT] }
    MarketplaceCategory:
      type: object
      required: [id, label, labelEn, parentId, aliases, resourceType, renderer, attributes, searchFilters, allowAdditionalAttributes, rules, isActive]
      properties:
        id: { type: string }
        label: { type: string }
        labelEn: { type: string }
        parentId: { type: ["string", "null"] }
        aliases: { type: array, items: { type: string } }
        resourceType: { type: string, enum: [PRODUCT, SERVICE, MIXED] }
        renderer: { type: string, enum: [GENERIC, CAR, PROPERTY] }
        attributes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CategoryAttributeDefinition" }
        searchFilters:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CategoryAttributeDefinition" }
        allowAdditionalAttributes: { type: boolean }
        rules: { $ref: "#/components/schemas/MarketplaceCategoryRules" }
        isActive: { type: boolean }
    MarketplaceCategoryInput:
      type: object
      required: [id, label, labelEn, resourceType, renderer, aliases, attributes, searchFilters, rules]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        label: { type: string, minLength: 1, maxLength: 100 }
        labelEn: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: ["string", "null"] }
        aliases: { type: array, maxItems: 40, items: { type: string, maxLength: 100 } }
        resourceType: { type: string, enum: [PRODUCT, SERVICE, MIXED] }
        renderer: { type: string, enum: [GENERIC, CAR, PROPERTY] }
        attributes:
          type: object
          maxProperties: 50
          additionalProperties: { $ref: "#/components/schemas/CategoryAttributeDefinition" }
        searchFilters:
          type: object
          maxProperties: 50
          additionalProperties: { $ref: "#/components/schemas/CategoryAttributeDefinition" }
        allowAdditionalAttributes: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
        rules: { $ref: "#/components/schemas/MarketplaceCategoryRules" }
    MarketplaceCategoryUpdate:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        labelEn: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: ["string", "null"] }
        aliases: { type: array, maxItems: 40, items: { type: string, maxLength: 100 } }
        resourceType: { type: string, enum: [PRODUCT, SERVICE, MIXED] }
        renderer: { type: string, enum: [GENERIC, CAR, PROPERTY] }
        attributes:
          type: object
          maxProperties: 50
          additionalProperties: { $ref: "#/components/schemas/CategoryAttributeDefinition" }
        searchFilters:
          type: object
          maxProperties: 50
          additionalProperties: { $ref: "#/components/schemas/CategoryAttributeDefinition" }
        allowAdditionalAttributes: { type: boolean }
        isActive: { type: boolean }
        rules: { $ref: "#/components/schemas/MarketplaceCategoryRules" }
    MarketplaceCategoryAuditRecord:
      type: object
      required: [id, categoryId, actorId, actorName, action, before, after, createdAt]
      properties:
        id: { type: string }
        categoryId: { type: string }
        actorId: { type: string }
        actorName: { type: string }
        action: { type: string, enum: [CREATE, UPDATE] }
        before:
          type: [object, "null"]
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    MarketRestrictedCategoriesSnapshot:
      type: object
      required: [restrictedCategories]
      properties:
        restrictedCategories:
          type: array
          items: { type: string }
    MarketCategoryPolicyAuditData:
      type: object
      required: [before, after]
      properties:
        before: { $ref: "#/components/schemas/MarketRestrictedCategoriesSnapshot" }
        after: { $ref: "#/components/schemas/MarketRestrictedCategoriesSnapshot" }
        reason: { type: string, enum: [CATEGORY_RENAMED] }
        categoryId: { type: string }
    MarketCategoryPolicyAuditRecord:
      type: object
      required: [id, marketId, actorId, actorName, action, data, createdAt]
      properties:
        id: { type: string }
        marketId: { type: string }
        actorId: { type: string }
        actorName: { type: string }
        action: { type: string, enum: [CATEGORY_POLICY] }
        data: { $ref: "#/components/schemas/MarketCategoryPolicyAuditData" }
        createdAt: { type: string, format: date-time }
    ListingPricingMode:
      type: string
      enum: [FIXED, NEGOTIABLE, OPEN_TO_OFFERS]
    ListingPriceRepresentation:
      type: string
      enum: [FIXED, NEGOTIABLE, OPEN_TO_OFFERS, STARTING_FROM, QUOTE_REQUIRED]
      description: >-
        What the price means. STARTING_FROM (a starting amount) and QUOTE_REQUIRED (no price; the
        seller quotes) are stored as pricingMode OPEN_TO_OFFERS and are never bought directly.
        Only FIXED is purchasable without an agreement; every representation accepts buyer proposals.
    Listing:
      type: object
      required: [id, title, description, category, area, unitPrice, pricingMode, currency, availableQuantity, reservedQuantity, inventoryMode, fulfilmentType, sellerName, rating, imageUrl, contactPhone, status]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        categoryId: { type: string }
        isSponsored:
          type: boolean
          description: Set only by the server for a paid placement; always rendered with a visible «إعلان ممول» label.
        sponsoredTier:
          type: string
          enum: [STANDARD, VIP]
          description: Paid tier of a sponsored slot; VIP is shown together with «ممول» and never means a verified seller.
        sponsoredToken:
          type: string
          maxLength: 1024
          description: Opaque signed attribution token for a delivered paid card (no personal data); the server alone decides any charge.
        recommendationReasons:
          type: array
          maxItems: 6
          items: { type: string, maxLength: 120 }
          description: Recommendation and buyer-ranking surfaces only; each reason is a deterministic signal that matched.
        area: { type: string }
        city: { type: string }
        attributes: { type: object, additionalProperties: true }
        paymentMethods:
          type: array
          maxItems: 2
          items: { type: string, enum: [CASH_DIRECT, CARD] }
        unitPrice: { type: ["string", "null"] }
        pricingMode: { $ref: "#/components/schemas/ListingPricingMode" }
        priceRepresentation: { $ref: "#/components/schemas/ListingPriceRepresentation" }
        currency: { type: string }
        availableQuantity: { type: ["integer", "null"], minimum: 0 }
        reservedQuantity: { type: integer }
        inventoryMode: { type: string, enum: [LIMITED, UNLIMITED] }
        fulfilmentType: { type: string, enum: [PICKUP, DELIVERY, DIGITAL, SERVICE] }
        sellerName: { type: string }
        sellerId: { type: string }
        sellerAvatarObjectPath: { type: ["string", "null"] }
        rating: { type: number }
        reviewCount: { type: integer }
        imageUrl: { type: string }
        imageUrls: { type: array, maxItems: 6, items: { type: string, maxLength: 2000 } }
        contactPhone: { type: ["string", "null"], maxLength: 30 }
        negotiable:
          type: boolean
          description: A buyer may propose a price on this listing (true for every listing with a known price representation). An agreed price is private to that buyer; the public price never changes.
        status: { type: string, enum: [DRAFT, PUBLISHED, PAUSED, ARCHIVED] }
        createdAt: { type: string }
    ListingInput:
      type: object
      required: [title, description, category, area, unitPrice, inventoryMode, fulfilmentType, imageUrl]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string, minLength: 10 }
        category: { type: string }
        categoryId: { type: string }
        area: { type: string }
        city: { type: string, maxLength: 100 }
        attributes: { type: object, additionalProperties: true }
        paymentMethods:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string, enum: [CASH_DIRECT, CARD] }
        unitPrice: { type: ["string", "null"], minLength: 1, maxLength: 32, pattern: '^[0-9]+(\.[0-9]+)?$' }
        pricingMode: { $ref: "#/components/schemas/ListingPricingMode" }
        priceRepresentation: { $ref: "#/components/schemas/ListingPriceRepresentation" }
        availableQuantity: { type: ["integer", "null"], minimum: 1 }
        inventoryMode: { type: string, enum: [LIMITED, UNLIMITED] }
        fulfilmentType: { type: string, enum: [PICKUP, DELIVERY, DIGITAL, SERVICE] }
        imageUrl: { type: string }
        imageUrls: { type: array, maxItems: 6, items: { type: string, maxLength: 2000 } }
        contactPhone: { type: ["string", "null"], maxLength: 30 }
        negotiable: { type: boolean }
    ListingStatusAction:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [PAUSE, RESUME] }
    ListingUpdate:
      type: object
      required: [title, description, category, area, unitPrice, inventoryMode, fulfilmentType, imageUrl]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string, minLength: 10 }
        category: { type: string }
        categoryId: { type: string }
        area: { type: string }
        city: { type: string, maxLength: 100 }
        attributes: { type: object, additionalProperties: true }
        unitPrice: { type: ["string", "null"], minLength: 1, maxLength: 32, pattern: '^[0-9]+(\.[0-9]+)?$' }
        pricingMode: { $ref: "#/components/schemas/ListingPricingMode" }
        priceRepresentation: { $ref: "#/components/schemas/ListingPriceRepresentation" }
        availableQuantity: { type: ["integer", "null"], minimum: 1 }
        inventoryMode: { type: string, enum: [LIMITED, UNLIMITED] }
        fulfilmentType: { type: string, enum: [PICKUP, DELIVERY, DIGITAL, SERVICE] }
        imageUrl: { type: string }
        imageUrls: { type: array, maxItems: 6, items: { type: string, maxLength: 2000 } }
        contactPhone: { type: ["string", "null"], maxLength: 30 }
        negotiable: { type: boolean }
    OrderItem:
      type: object
      required: [listingId, listingTitle, listingImageUrl, quantity, unitPrice, total, currency, fulfilmentType]
      properties:
        listingId: { type: string }
        listingTitle: { type: string }
        listingImageUrl: { type: string }
        quantity: { type: integer }
        unitPrice: { type: string }
        total: { type: string }
        currency: { type: string }
        fulfilmentType: { type: string, enum: [PICKUP, DELIVERY, DIGITAL, SERVICE] }
    Order:
      type: object
      required: [id, listingId, listingTitle, listingImageUrl, buyerName, sellerName, quantity, unitPrice, total, currency, fulfilmentType, status, createdAt, updatedAt, expiresAt, platformFeeMinor, sellerAmountMinor, minorUnitScale, commissionRateBps]
      properties:
        id: { type: string }
        listingId: { type: string }
        listingTitle: { type: string }
        listingImageUrl: { type: string }
        buyerName: { type: string }
        buyerAvatarObjectPath: { type: ["string", "null"] }
        sellerName: { type: string }
        sellerAvatarObjectPath: { type: ["string", "null"] }
        quantity: { type: integer }
        unitPrice: { type: string }
        total: { type: string }
        currency: { type: string }
        platformFeeMinor: { type: integer, minimum: 0 }
        sellerAmountMinor: { type: integer, minimum: 0 }
        minorUnitScale: { type: integer, minimum: 0, maximum: 6 }
        commissionRateBps: { type: integer, minimum: 0, maximum: 10000 }
        fulfilmentType: { type: string }
        status: { type: string, enum: [CREATED, PAYMENT_PENDING, PAID, ACCEPTED, IN_PROGRESS, SELLER_MARKED_DELIVERED, BUYER_CONFIRMED, COMPLETED, CANCELLED, DISPUTED] }
        createdAt: { type: string }
        updatedAt: { type: string }
        expiresAt: { type: string }
        deliveryProof: { type: ["string", "null"] }
        issue: { type: ["string", "null"], maxLength: 1500 }
        dispute:
          type: object
          required: [reason, description, evidence]
          properties:
            reason: { type: string, minLength: 3, maxLength: 100 }
            description: { type: string, minLength: 10, maxLength: 600 }
            evidence:
              type: array
              items:
                type: object
                properties:
                  type: { type: string }
                  reference: { type: string }
                  submittedBy: { type: string }
                  createdAt: { type: string }
            status: { type: string }
            resolution: { type: [string, "null"] }
            resolvedAt: { type: [string, "null"] }
        sellerId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    OrderContactRelease:
      type: object
      required: [orderId, contacts]
      properties:
        orderId: { type: string }
        contacts:
          type: array
          items:
            type: object
            required: [listingTitle, phone]
            properties:
              listingTitle: { type: string }
              phone: { type: string }
    DisputeEvidence:
      type: object
      required: [type, reference, submittedBy, createdAt]
      properties:
        type: { type: string }
        reference: { type: string }
        submittedBy: { type: string }
        createdAt: { type: string }
    AdminDispute:
      type: object
      required: [id, orderId, status, reason, description, evidence, orderStatus, buyerId, buyerName, sellerId, sellerName, quantity, subtotalMinor, currencyCode, minorUnitScale, commissionRateBps, platformFeeMinor, sellerAmountMinor, createdAt, resolution, resolutionNote, resolvedAt, resolvedBy, resolvedByName]
      properties:
        id: { type: string }
        orderId: { type: string }
        status: { type: string, enum: [OPEN, RESOLVED] }
        reason: { type: string }
        description: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/DisputeEvidence" }
        orderStatus: { type: string }
        buyerId: { type: string }
        buyerName: { type: string }
        sellerId: { type: string }
        sellerName: { type: string }
        quantity: { type: integer }
        subtotalMinor: { type: integer, minimum: 0 }
        currencyCode: { type: string }
        minorUnitScale: { type: integer, minimum: 0, maximum: 6 }
        commissionRateBps: { type: integer, minimum: 0, maximum: 10000 }
        platformFeeMinor: { type: integer, minimum: 0 }
        sellerAmountMinor: { type: integer, minimum: 0 }
        createdAt: { type: string }
        resolution: { type: ["string", "null"] }
        resolutionNote: { type: ["string", "null"] }
        resolvedAt: { type: ["string", "null"] }
        resolvedBy: { type: ["string", "null"] }
        resolvedByName: { type: ["string", "null"] }
    ResolveAdminDisputeInput:
      type: object
      required: [resolution]
      properties:
        resolution: { type: string, enum: [BUYER, SELLER] }
        note: { type: string, maxLength: 1000 }
    AdminDisputeResolutionResult:
      type: object
      required: [orderId, disputeStatus, orderStatus, resolution, resolutionNote, resolvedAt, resolvedBy, commissionRateBps, platformFeeMinor, sellerAmountMinor, sellerDueCreated]
      properties:
        orderId: { type: string }
        disputeStatus: { type: string, enum: [RESOLVED] }
        orderStatus: { type: string, enum: [COMPLETED, CANCELLED] }
        resolution: { type: string, enum: [BUYER, SELLER] }
        resolutionNote: { type: ["string", "null"] }
        resolvedAt: { type: string }
        resolvedBy: { type: string }
        commissionRateBps: { type: integer, minimum: 0, maximum: 10000 }
