        placement: { type: string, enum: [SEARCH_AND_CHAT] }
        priceMinor: { type: integer, minimum: 1, maximum: 2000000000 }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        durationDays: { type: integer, minimum: 1, maximum: 365 }
        enabled: { type: boolean }
    PromotionPreviewInput:
