openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DINAR general marketplace API with seller-defined listing prices
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: business
    description: DINAR Business identity, verification and publication (D2)
  - name: cash
    description: W08 direct cash attestations and cash refunds (SIMULATION/development only)
  - name: compliance
    description: W09 policy lifecycle, explicit consent and market compliance gates
  - name: trust
    description: W10 support cases, fraud signals and WhatsApp readiness (no message is ever sent)
  - name: commercial
    description: DINAR commercial economy (prepaid commercial balance, paid placements, Market Pulse, DINAR Business)
  - name: auth
    description: Anonymous authentication and verified account creation
  - name: marketplace
    description: Listings and marketplace discovery
  - name: orders
    description: Governed order lifecycle
  - name: dashboard
    description: Buyer and seller overview data
  - name: account
    description: Authenticated account profile settings
  - name: storage
    description: Public user profile image upload and serving
  - name: ai
    description: Authenticated DINAR AI discovery conversations
paths:
  /auth/phone-verification/challenges:
    post:
      operationId: requestPhoneVerificationChallenge
      tags: [auth]
      summary: Start a phone ownership verification challenge
      description: The response does not disclose whether the phone belongs to an existing account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneVerificationChallengeRequest" }
      responses:
        "202":
          description: A challenge was accepted for delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneVerificationChallengeResponse" }
        "400":
          description: Invalid phone number
        "429":
          description: Too many verification attempts
        "503":
          description: No phone verification provider is configured
  /auth/phone-verification/challenges/verify:
    post:
      operationId: verifyPhoneVerificationChallenge
      tags: [auth]
      summary: Verify a one-time phone code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneVerificationCodeRequest" }
      responses:
        "200":
          description: Short-lived proof for one account registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneVerificationCodeResponse" }
        "400":
          description: Invalid, expired, or already-used code
        "429":
          description: Too many verification attempts
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create an account after phone ownership verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegisterRequest" }
      responses:
        "201":
          description: Account created and authenticated
        "400":
          description: Invalid registration details or missing phone proof
        "409":
          description: Registration could not be completed with these details
        "429":
          description: Too many registration attempts
        "503":
          description: No eligible account market is available
  /auth/google:
    post:
      operationId: signInWithGoogle
      tags: [auth]
      summary: Verify a Google ID token; signs in a linked account or starts phone verification
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GoogleSignInInput" } } } }
      responses:
        "200": { description: "Signed in, or phone verification required", content: { application/json: { schema: { $ref: "#/components/schemas/GoogleSignInResult" } } } }
  /auth/google/complete:
    post:
      operationId: completeGoogleSignIn
      tags: [auth]
      summary: Link or create the account after SMS phone verification
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GoogleCompleteInput" } } } }
      responses:
        "200": { description: "Linked to the existing account of this phone", content: { application/json: { schema: { $ref: "#/components/schemas/GoogleSignInResult" } } } }
        "201": { description: "Account created", content: { application/json: { schema: { $ref: "#/components/schemas/GoogleSignInResult" } } } }
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Start a session for a phone-verified account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLoginRequest" }
      responses:
        "200":
          description: Authenticated account session
        "401":
          description: Invalid credentials or missing phone proof
        "429":
          description: Too many login attempts
  /account/profile-avatar/upload-url:
    post:
      operationId: requestProfileAvatarUpload
      tags: [account]
      summary: Request a profile image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileAvatarUploadRequest" }
      responses:
        "200":
          description: A short-lived URL for direct image upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileAvatarUploadResponse" }
        "400":
          description: Invalid image metadata
        "401":
          description: Sign-in required
  /account/profile-avatar:
    put:
      operationId: setProfileAvatar
      tags: [account]
      summary: Save the authenticated user's uploaded profile image
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileAvatarSetRequest" }
      responses:
        "200":
          description: Profile image saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileAvatarSetResponse" }
        "400":
          description: Invalid or incomplete uploaded image
        "401":
          description: Sign-in required
        "403":
          description: The uploaded image does not belong to this user
  /account/listing-photos/upload-url:
    post:
      operationId: requestListingPhotoUpload
      tags: [account]
      summary: Request a private listing photo upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingPhotoUploadRequest" }
      responses:
        "200":
          description: A short-lived URL for direct image upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingPhotoUploadResponse" }
        "400":
          description: Invalid image metadata
        "401":
          description: Sign-in required
  /account/listing-photos/complete:
    post:
      operationId: completeListingPhotoUpload
      tags: [account]
      summary: Validate and finalize a private listing photo upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingPhotoCompleteRequest" }
      responses:
        "200":
          description: Validated private listing photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingPhotoCompleteResponse" }
        "400":
          description: Invalid or incomplete uploaded image
        "401":
          description: Sign-in required
        "403":
          description: The uploaded image does not belong to this user
  /storage/objects/{objectPath}:
    get:
      operationId: getProfileAvatarObject
      tags: [storage]
      summary: Serve a public profile image from object storage
      parameters:
        - in: path
          name: objectPath
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profile image bytes
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: Image not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Reports whether the API can serve traffic — database reachable, schema current, essential configuration valid and phone verification deliverable. Check values name the failing area only, never a setting's value.
      responses:
        "200":
          description: API and required database schema are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: API is alive but the database, schema, essential configuration or phone verification is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /listings:
    get:
      operationId: getListings
      tags: [marketplace]
      summary: List published listings
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: categoryId
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [RELEVANCE, PRICE_ASC, PRICE_DESC, NEWEST, YEAR_ASC, YEAR_DESC, MILEAGE_ASC, MILEAGE_DESC, PROPERTY_SIZE_ASC, PROPERTY_SIZE_DESC] }
        - in: query
          name: status
          schema: { type: string, enum: [PUBLISHED, PAUSED, ARCHIVED] }
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }
    post:
      operationId: createListing
      tags: [marketplace]
      summary: Create a listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
  /categories:
    get:
      operationId: getMarketplaceCategories
      tags: [marketplace]
      summary: List active marketplace categories and their data-driven fields
      responses:
        "200":
          description: Active category registry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketplaceCategory" }
  /admin/categories:
    get:
      operationId: getAdminMarketplaceCategories
      tags: [marketplace]
      summary: List all marketplace categories for administrators
      responses:
        "200":
          description: Category registry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketplaceCategory" }
    post:
      operationId: createMarketplaceCategory
      tags: [marketplace]
      summary: Add a marketplace category as an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCategoryInput" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceCategory" }
        "400":
          description: Invalid category definition
        "403":
          description: Administrator access required
  /admin/categories/{id}:
    patch:
      operationId: updateMarketplaceCategory
      tags: [marketplace]
      summary: Update or deactivate a marketplace category as an administrator
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCategoryUpdate" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceCategory" }
        "400":
          description: Invalid category definition
        "403":
          description: Administrator access required
        "404":
          description: Category not found
  /admin/categories/{id}/audit:
    get:
      operationId: getAdminMarketplaceCategoryAudit
      tags: [marketplace]
      summary: List category policy changes for administrators
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Category change history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketplaceCategoryAuditRecord" }
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Category not found
  /admin/markets/{id}/audit:
    get:
      operationId: getAdminMarketCategoryPolicyAudit
      tags: [marketplace]
      summary: List restricted-category policy changes for administrators
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Market category policy history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketCategoryPolicyAuditRecord" }
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Market not found
  /listings/{id}:
    get:
      operationId: getListing
      tags: [marketplace]
      summary: Get a listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404":
          description: Not found
    patch:
      operationId: updateListing
      tags: [marketplace]
      summary: Update a seller's listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingUpdate" }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "400":
          description: Invalid listing update
        "404":
          description: Listing not found
    delete:
      operationId: archiveListing
      tags: [marketplace]
      summary: Archive a seller listing without deleting order history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived listing; historical order references are retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404":
          description: Listing not found
        "409":
          description: Listing has a reservation or an unresolved order
  /listings/{id}/status:
    patch:
      operationId: changeListingStatus
      tags: [marketplace]
      summary: Pause or resume an owned listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingStatusAction" }
      responses:
        "200":
          description: Updated listing status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "400":
          description: Invalid status action
        "404":
          description: Listing not found
        "409":
          description: Listing cannot make that status transition
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get marketplace dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: List current user's orders
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [buyer, seller] }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order and reserve inventory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: Out of stock
  /checkout:
    post:
      operationId: checkoutCart
      tags: [orders]
      summary: Validate a cart and create one order per seller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "201":
          description: Seller orders created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "400":
          description: Invalid checkout input
        "409":
          description: Cart changed or inventory is no longer available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutConflict" }
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{id}/counterpart-contact:
    get:
      operationId: getOrderCounterpartContact
      tags: [orders]
      summary: The other party's name and phone after the seller accepts, plus the buyer's payment preference
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Contact state", content: { application/json: { schema: { $ref: "#/components/schemas/OrderCounterpartContact" } } } }
  /orders/{id}/settlement-preference:
    put:
      operationId: setOrderSettlementPreference
      tags: [orders]
      summary: The buyer states how they prefer to pay outside DINAR (information only)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SettlementPreferenceInput" } } } }
      responses:
        "200": { description: "Preference stored", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /orders/{id}/contact:
    get:
      operationId: getOrderContact
      tags: [orders]
      summary: Retrieve seller-approved contact for an eligible order buyer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Freshly authorized seller contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderContactRelease" }
        "404":
          description: Order contact is unavailable to this actor
  /orders/{id}/fulfillment:
    get:
      operationId: getOrderFulfillment
      tags: [orders]
      summary: Delivery method, state and transaction locations for one order (its buyer and seller only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Participant delivery view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDelivery" }
        "404":
          description: Order not found for this actor
  /courier/orders/{id}/location-sharing:
    get:
      operationId: getDriverLocationSharing
      tags: [marketplace]
      summary: The assigned driver's own location-sharing state for one order
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Sharing state", content: { application/json: { schema: { $ref: "#/components/schemas/DriverLocationSharing" } } } }
  /courier/orders/{id}/location-sharing/start:
    post:
      operationId: startDriverLocationSharing
      tags: [marketplace]
      summary: Start sharing the assigned driver's location for this delivery (explicit consent)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StartDriverLocationSharingInput" } } } }
      responses:
        "200": { description: Sharing started, content: { application/json: { schema: { $ref: "#/components/schemas/DriverLocationSharing" } } } }
  /courier/orders/{id}/location-sharing/location:
    post:
      operationId: updateDriverLocation
      tags: [marketplace]
      summary: Submit one validated position during an active sharing session
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DriverLocationUpdateInput" } } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/DriverLocationUpdateResult" } } } }
        "409": { description: "Duplicate, out of order or sharing not active", content: { application/json: { schema: { $ref: "#/components/schemas/DriverLocationUpdateResult" } } } }
        "429": { description: Too frequent, content: { application/json: { schema: { $ref: "#/components/schemas/DriverLocationUpdateResult" } } } }
  /courier/orders/{id}/location-sharing/stop:
    post:
      operationId: stopDriverLocationSharing
      tags: [marketplace]
      summary: Stop sharing; stored coordinates are cleared
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: Sharing stopped, content: { application/json: { schema: { $ref: "#/components/schemas/DriverLocationSharing" } } } }
  /orders/{id}/courier-fare:
    get:
      operationId: getCourierFare
      tags: [orders]
      summary: Read the negotiated fare for the buyer or assigned courier
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current proposal or immutable agreed fare snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierFareView" }
        "404":
          description: Order not found for this actor
  /orders/{id}/courier-fare/proposals:
    post:
      operationId: proposeCourierFare
      tags: [orders]
      summary: Propose a delivery fare in the order market's currency
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourierFareProposalInput" }
      responses:
        "200":
          description: The current fare proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierFareProposalResult" }
        "400":
          description: Invalid amount or idempotency key
        "409":
          description: Fare cannot be negotiated or the agreement is already locked
  /orders/{id}/courier-fare/confirm:
    post:
      operationId: confirmCourierFare
      tags: [orders]
      summary: Confirm the current courier fare proposal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourierFareConfirmInput" }
      responses:
        "200":
          description: Confirmation status and fare snapshot, when both parties agree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierFareConfirmResult" }
        "404":
          description: Order or proposal not found for this actor
        "409":
          description: Proposal is stale or fare confirmation is closed
  /courier/commission-account:
    get:
      operationId: getCourierCommissionAccount
      tags: [courier]
      summary: Read courier commission receivables and acceptance hold status
      responses:
        "200":
          description: Balances are separated by market and currency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierCommissionAccount" }
  /courier/commission-account/settlements:
    post:
      operationId: settleCourierCommissionSimulation
      tags: [courier]
      summary: Clear a market's courier receivable in a no-transfer development simulation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourierCommissionSettlementInput" }
      responses:
        "200":
          description: SIMULATION_ONLY settlement record; no money is transferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierCommissionSettlementResult" }
        "409":
          description: No outstanding receivable or settlement conflict
  /orders/{id}/tracking:
    get:
      operationId: getOrderTracking
      tags: [orders]
      summary: Get participant-authorized canonical delivery status and optional ephemeral provider tracking
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: No-store tracking view; coordinates are returned only from an authorized live provider
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderTracking" }
        "404":
          description: Order not found for this actor
  /orders/{id}/accept:
    post:
      operationId: acceptOrder
      tags: [orders]
      summary: Accept an order as seller
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Accepted order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{id}/delivery:
    post:
      operationId: markOrderDelivered
      tags: [orders]
      summary: Mark an order delivered with proof
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryInput" }
