        longitude: { type: number, nullable: true }
        accuracyMeters: { type: number, nullable: true }
        accuracyNote: { type: string, nullable: true }
        city: { type: string }
        area: { type: string }
        addressText: { type: string, nullable: true }
        note: { type: string, nullable: true }
