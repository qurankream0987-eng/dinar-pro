      <stop offset="1" stop-color="#123B91"/>
    </linearGradient>
    <linearGradient id="dai-gold" x1="256" y1="88" x2="424" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6DC94"/>
      <stop offset=".5" stop-color="#D7AA42"/>
      <stop offset="1" stop-color="#A97A1E"/>
    </linearGradient>
