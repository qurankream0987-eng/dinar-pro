<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>DINAR AI</title>
  <!-- DINAR AI mark: a D whose stem is royal-blue glass with fine circuit traces and whose bowl
       is gold; inside, a conversation bubble over a small cart (conversation + commerce). -->
