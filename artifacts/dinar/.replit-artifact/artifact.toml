kind = "web"
previewPath = "/"
title = "Dinar Marketplace"
description = "An Arabic-first fixed-unit-price marketplace where buyers choose quantities, place governed orders, coordinate delivery in an order-bound conversation, and resolve issues with evidence."
version = "1.0.0"
id = "artifacts/dinar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24108

[services.development]
run = "export NODE_ENV=development && pnpm --filter @workspace/dinar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dinar", "run", "build" ]
serve = "static"
publicDir = "artifacts/dinar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24108"
BASE_PATH = "/"
